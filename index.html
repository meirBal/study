const BUCKET = 'study-files', FCACHE = 'study-files-v1';
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = k => { try { const s = atob(k.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(s, c => c.charCodeAt(0))); } catch { return k; } };
const keyOf = name => { const m = name.match(/\.([A-Za-z0-9]{1,5})$/); return b64(name.replace(/\.[A-Za-z0-9]{1,5}$/, '')) + (m ? '.' + m[1].toLowerCase() : ''); };
const escHTML = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nameOf = key => { const m = key.match(/\.([a-z0-9]{1,5})$/); return unb64(key.replace(/\.[a-z0-9]{1,5}$/, '')) + (m ? '.' + m[1] : ''); };
const idxKey = id => `study_files_${user.id}_${id}`;
async function cachedFile(path) { try { const c = await caches.open(FCACHE); return await c.match('/files/' + path); } catch { return null; } }
async function materialsView(id, msg = '') {
  leave();
  const dir = `${user.id}/${id}`;
  let files = null;
  try { const { data, error } = await sb.storage.from(BUCKET).list(dir, { limit: 200, sortBy: { column: 'name', order: 'asc' } }); if (error) throw error;
    files = data.filter(f => f.id).map(f => f.name); localStorage.setItem(idxKey(id), JSON.stringify(files)); }
  catch { try { files = JSON.parse(localStorage.getItem(idxKey(id))) || []; } catch { files = []; } msg ||= 'אין חיבור – מוצגים הקבצים שנשמרו בטלפון.'; }
  const rows = await Promise.all(files.map(async k => `<div class="file"><button class="ghost fopen" data-k="${escHTML(k)}"><span>${/\.pdf$/.test(k) ? '📄' : '🖼'}</span><b>${escHTML(nameOf(k))}</b>${await cachedFile(dir + '/' + k) ? '<em>✓ שמור בטלפון</em>' : ''}</button><button class="ghost fdel" data-k="${escHTML(k)}" aria-label="מחיקה">🗑</button></div>`));
  app().innerHTML = `<header><button class="ghost" id="back">→</button><h1>📚 חומרים – ${COURSES[id].name}</h1></header>
    <div class="card"><p class="hint">מבחנים, פתרונות וסיכומים – פרטיים לחשבון שלך. קובץ שנפתח פעם אחת זמין גם בלי אינטרנט.</p>
    <label class="primary upl">⬆ העלאת קבצים (אפשר לבחור כמה)<input type="file" id="up" accept="application/pdf,image/*" multiple hidden></label>
    <p class="msg" id="fmsg">${msg}</p></div>
    <div class="card">${rows.join('') || '<p class="hint">עדיין אין קבצים בקורס הזה.</p>'}</div>`;
  $('#back').onclick = () => courseView(id);
  $('#up').onchange = async e => {
    const list = [...e.target.files]; let ok = 0;
    for (const [i, f] of list.entries()) {
      $('#fmsg').textContent = `מעלה ${i + 1}/${list.length}: ${f.name}`;
      const { error } = await sb.storage.from(BUCKET).upload(`${dir}/${keyOf(f.name)}`, f, { upsert: true, contentType: f.type || 'application/pdf' });
      if (error) { $('#fmsg').textContent = '⚠ ' + f.name + ': ' + error.message; return; }
      ok++;
    }
    materialsView(id, `הועלו ${ok} קבצים ✓`);
  };
  app().querySelectorAll('.fopen').forEach(b => b.onclick = async () => {
    const path = `${dir}/${b.dataset.k}`; $('#fmsg').textContent = 'פותח…';
    let res = await cachedFile(path), blob;
    if (res) blob = await res.blob();
    else {
      const { data, error } = await sb.storage.from(BUCKET).download(path);
      if (error) return $('#fmsg').textContent = '⚠ אין חיבור והקובץ עוד לא נשמר בטלפון';
      blob = data;
      try { const c = await caches.open(FCACHE); await c.put('/files/' + path, new Response(blob, { headers: { 'Content-Type': blob.type } })); } catch { }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nameOf(b.dataset.k); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    $('#fmsg').textContent = '';
    if (!b.querySelector('em')) b.insertAdjacentHTML('beforeend', '<em>✓ שמור בטלפון</em>');
  });
  app().querySelectorAll('.fdel').forEach(b => b.onclick = async () => {
    if (!confirm('למחוק את "' + nameOf(b.dataset.k) + '"?')) return;
    const path = `${dir}/${b.dataset.k}`, { error } = await sb.storage.from(BUCKET).remove([path]);
    try { (await caches.open(FCACHE)).delete('/files/' + path); } catch { }
    materialsView(id, error ? '⚠ ' + error.message : 'נמחק');
  });
}
function sheetView(id) {
  app().innerHTML = `<header><button class="ghost" id="back">→</button><h1>דף נוסחאות</h1></header><div class="card sheet">${COURSES[id].sheet}</div>`;
  $('#back').onclick = () => courseView(id);
}

function partsHTML(q, qi) {
  if (q.choices) {
    q.parts = [{ mc: 1 }];
    return `<div class="mc" id="p${qi}_0">${q.choices.map((c, i) => `<button class="choice" data-i="${i}"><b>${'אבגד'[i]}</b><span>${nb(c)}</span></button>`).join('')}<i></i></div>`;
  }
  return q.parts.map((p, i) => `<div class="part" id="p${qi}_${i}"><label>${p.label} =</label>
    <input inputmode="decimal" dir="ltr" placeholder="1.23e16">
    ${p.units ? `<select>${['', ...shuffle(p.units)].map(u => `<option>${u}</option>`).join('')}</select>` : p.unit ? `<span>${p.unit}</span>` : ''}
    <i></i></div>`).join('');
}
const nb = h => h.replace(/(\d|<\/sup>) (?=[A-Za-zµΩÅ°%])/g, '$1&nbsp;');
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
function bindChoices(root) {
  root.querySelectorAll('.mc').forEach(m => m.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if (m.dataset.done) return; m.querySelectorAll('.choice').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
  }));
}
function grade(q, qi) {
  if (q.choices) {
    const m = $(`#p${qi}_0`), sel = m.querySelector('.choice.sel'), ok = sel && +sel.dataset.i === q.answer;
    m.dataset.done = 1; m.querySelectorAll('.choice').forEach(b => { if (+b.dataset.i === q.answer) b.classList.add('right'); else if (b === sel) b.classList.add('wrong'); });
    m.querySelector('i').textContent = ok ? '✓ נכון' : sel ? '✗ התשובה הנכונה מסומנת בירוק' : '✗ לא נבחרה תשובה';
    return ok ? 1 : 0;
  }
  let ok = 0;
  q.parts.forEach((p, i) => {
    const el = $(`#p${qi}_${i}`), v = parseNum(el.querySelector('input').value), sel = el.querySelector('select');
    const numOk = isFinite(v) && Math.abs(v - p.ans) <= TOL * Math.abs(p.ans) + 1e-12;
    const unitOk = !sel || sel.value === p.unit;
    el.querySelector('i').textContent = numOk && unitOk ? '✓' : !numOk ? `✗ ${fmt(p.ans).replace(/<[^>]+>/g, '')}` : '✗ יחידות';
    el.className = 'part ' + (numOk && unitOk ? 'ok' : 'bad');
    if (numOk && unitOk) ok++;
  });
  return ok;
}

function practice(id, keys) {
  leave();
  const C = COURSES[id], k = keys[Math.floor(Math.random() * keys.length)], t = C.topics[k], q = t.gen();
  app().innerHTML = `<header><button class="ghost" id="back">→</button><h1>${t.title}</h1></header>
    <div class="card"><p class="q">${nb(q.text)}</p>${partsHTML(q, 0)}
    <div class="row"><button class="primary" id="check">בדוק</button><button class="ghost" id="next">שאלה אחרת</button></div>
    <details id="sol" hidden><summary>פתרון מלא</summary><div>${nb(q.sol)}</div></details></div>`;
  isolateMath(app()); bindChoices(app());
  $('#back').onclick = () => courseView(id);
  $('#next').onclick = () => practice(id, keys);
  $('#check').onclick = () => {
    const ok = grade(q, 0);
    record(id, k, q.parts.length, ok);
    $('#check').disabled = true; $('#sol').hidden = false; if (ok < q.parts.length) $('#sol').open = true;
  };
}

function examView(id) {
  const C = COURSES[id], byGroup = Object.keys(C.groups).map(g => shuffle(Object.keys(C.topics).filter(k => C.topics[k].group === g)));
  const keys = [];
  for (let r = 0; keys.length < 6; r++) byGroup.forEach(g => g[r] && keys.length < 6 && keys.push(g[r]));
  const qs = keys.map(k => ({ k, q: C.topics[k].gen() }));
  let left = C.minutes * 60;
  app().innerHTML = `<header><button class="ghost" id="back">→</button><h1>מבחן – ${C.name}</h1><b id="clock"></b></header>
    ${qs.map(({ k, q }, i) => `<div class="card"><h3>שאלה ${i + 1} · ${C.groups[C.topics[k].group]}</h3><p class="q">${nb(q.text)}</p>${partsHTML(q, i)}
      <details hidden class="esol"><summary>פתרון</summary><div>${nb(q.sol)}</div></details></div>`).join('')}
    <button class="primary wide" id="submit">הגשה</button><p id="score" class="score"></p>`;
  isolateMath(app()); bindChoices(app());
  const tick = () => { $('#clock').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; if (left-- <= 0) submit(); };
  const submit = () => {
    clearInterval(timer);
    let tot = 0, ok = 0;
    qs.forEach(({ k, q }, i) => { const g = grade(q, i); ok += g; tot += q.parts.length; record(id, k, q.parts.length, g); });
    app().querySelectorAll('.esol').forEach(d => d.hidden = false);
    $('#submit').remove();
    $('#back').onclick = () => courseView(id);
    $('#score').textContent = `ציון: ${Math.round(100 * ok / tot)} (${ok}/${tot} סעיפים)`;
    $('#score').scrollIntoView({ behavior: 'smooth' });
  };
  $('#back').onclick = () => confirm('לצאת מהמבחן? ההתקדמות לא תישמר.') && courseView(id);
  $('#submit').onclick = submit;
  tick(); timer = setInterval(tick, 1000);
}

</script>
</body>
