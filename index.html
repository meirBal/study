<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<title>מעבדת מבחנים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root { --bg:#14161f; --card:#1d2030; --line:#2c3046; --tx:#e8e9f0; --mut:#9a9db3; --acc:#f2b84b; --ok:#4fc38a; --bad:#ef6b6b; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.55 system-ui, "Segoe UI", Arial, sans-serif; }
#app { max-width:680px; margin:0 auto; padding:16px 16px 48px; }
header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
header h1 { flex:1; font-size:20px; margin:0; }
h1 { color:var(--acc); }
h3 { margin:18px 0 6px; color:var(--mut); font-size:14px; font-weight:600; }
button { font:inherit; color:inherit; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; background:var(--card); }
button:disabled { opacity:.5; cursor:default; }
.primary { background:var(--acc); color:#1a1300; font-weight:700; flex:1; }
.ghost { background:transparent; border:1px solid var(--line); }
.wide { width:100%; margin-top:10px; }
.row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
.course, .topic { display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:8px; text-align:right; border:1px solid var(--line); }
.course { flex-direction:column; align-items:flex-start; padding:16px; }
.course span, .topic em { color:var(--mut); font-style:normal; font-size:14px; }
.q { margin-top:0; }
.part { display:flex; align-items:center; gap:8px; margin:8px 0; flex-wrap:wrap; }
.part label { min-width:96px; }
.part input, .part select, .auth input { background:var(--bg); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
.part input { width:140px; }
.part i { font-style:normal; font-size:14px; }
.part.ok i { color:var(--ok); } .part.bad i { color:var(--bad); }
.part.ok input { border-color:var(--ok); } .part.bad input { border-color:var(--bad); }
details { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
summary { color:var(--acc); cursor:pointer; }
details div { margin-top:8px; line-height:1.9; }
.auth { display:flex; flex-direction:column; gap:10px; margin-top:10vh; }
.auth h2 { margin:0; }
.auth a { color:var(--acc); cursor:pointer; }
.msg { color:var(--acc); min-height:1em; margin:0; }
.hint { color:var(--mut); font-size:13px; margin:0; }
.sheet p { line-height:2; }
.score { font-size:22px; font-weight:700; text-align:center; color:var(--acc); }

.sheetbg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:9; }
.sheetbg .card { max-width:420px; width:100%; }
code { background:var(--bg); padding:2px 6px; border-radius:6px; word-break:break-all; }

.lesson p, .lesson li { line-height:1.8; }
.intro { font-size:17px; color:var(--acc); }
.f { display:block; background:var(--bg); border-right:3px solid var(--acc); padding:8px 10px; border-radius:6px; margin:8px 0; direction:ltr; text-align:left; overflow-x:auto; }
.t { border-collapse:collapse; width:100%; margin:8px 0; font-size:14px; }
.t td, .t th { border:1px solid var(--line); padding:6px; text-align:center; }
.t th { color:var(--acc); }
.plot { direction:ltr; unicode-bidi:isolate; width:100%; height:auto; background:var(--bg); border-radius:10px; }
.plot .ax { stroke:var(--mut); stroke-width:1; }
.plot .axl, .plot .tick { fill:var(--mut); font-size:10px; }
.plot .lbl { fill:var(--tx); font-size:10px; }
.plot .ln { fill:none; stroke-width:2.2; }
.plot .dash { stroke-width:1; stroke-dasharray:4 3; }
.plot .c1 { stroke:var(--acc); } .plot .c2 { stroke:#4fc3c3; } .plot .c3 { stroke:var(--mut); } .plot .c4 { stroke:#5a5f7d; }
.plot .lbl.c2 { fill:#4fc3c3; } .plot .lbl.c1 { fill:var(--acc); }
.plot .pt { fill:var(--tx); stroke-width:2; } .plot .pt.c2 { fill:#4fc3c3; } .plot .pt.c1 { fill:var(--acc); } .plot .pt.c3 { fill:var(--mut); } .plot .pt.c5 { fill:#8f8fe0; } .plot .c5 { stroke:#8f8fe0; } .plot .lbl.c5 { fill:#8f8fe0; } .plot .lbl.c3 { fill:var(--mut); }
.sch .dt { fill:var(--tx); }
.plot .fill { stroke:none; fill-opacity:.18; } .plot .fill.c2 { fill:#4fc3c3; } .plot .fill.c1 { fill:var(--acc); }
.plot .bar.b0 { fill:var(--acc); } .plot .bar.b1 { fill:#4fc3c3; } .plot .bar.b2 { fill:#8f8fe0; } .plot .bar.bad { fill:var(--bad); }
.plot .box { fill:var(--bg); stroke:var(--tx); }
.plot .px { fill:none; stroke:var(--tx); stroke-width:2; } .plot .px.zo { fill:var(--bg); } .plot .fill.bad { fill:var(--bad); fill-opacity:.1; }
.c1t { color:var(--acc); } .c2t { color:#4fc3c3; }
.sliders label { display:grid; grid-template-columns:110px 1fr 70px; align-items:center; gap:8px; margin-top:8px; font-size:14px; }
.sliders input { width:100%; accent-color:var(--acc); }
.sliders b { font-weight:600; direction:ltr; text-align:left; font-size:13px; }
.readout { margin-top:10px; background:var(--bg); border-radius:8px; padding:8px 10px; font-size:14px; line-height:1.8; }
.steps li { opacity:.12; transition:opacity .5s, transform .5s; transform:translateY(4px); margin:6px 0; line-height:1.9; }
.steps li.on { opacity:1; transform:none; }
.circ { margin:8px 0; }
bdi[dir=ltr] { display:inline-block; direction:ltr; unicode-bidi:isolate; max-width:100%; vertical-align:middle; background:rgba(242,184,75,.09); border:1px solid rgba(242,184,75,.18); border-radius:6px; padding:0 5px; margin:1px 1px; line-height:1.6; font-family:"Cambria Math","STIX Two Math","Times New Roman",serif; font-size:1.03em; white-space:normal; text-align:left; }
.steps bdi[dir=ltr], .readout bdi[dir=ltr] { background:rgba(242,184,75,.06); }
h1 bdi[dir=ltr], .topic bdi[dir=ltr], .sliders bdi[dir=ltr], .part label bdi[dir=ltr] { background:none; border:0; padding:0; font-family:inherit; font-size:inherit; }
.mc { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.choice { display:flex; gap:10px; align-items:center; text-align:right; border:1px solid var(--line); background:var(--bg); padding:12px; }
.choice b { color:var(--acc); min-width:18px; }
.choice.sel { border-color:var(--acc); background:rgba(242,184,75,.1); }
.choice.right { border-color:var(--ok); background:rgba(79,195,138,.15); }
.choice.wrong { border-color:var(--bad); background:rgba(239,107,107,.15); }
.mc i { font-style:normal; font-size:14px; }
.vid { background:var(--bg); border-radius:12px; padding:6px; }
.vcap { min-height:4.2em; margin:8px 4px 2px; font-size:16px; line-height:1.8; }
.vcap.in { animation:capIn .5s ease; }
@keyframes capIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.vdots { display:flex; gap:6px; justify-content:center; margin-top:10px; }
.vdots span { width:22px; height:5px; border-radius:3px; background:var(--line); cursor:pointer; }
.vdots span.done { background:#7a6332; } .vdots span.cur { background:var(--acc); }
.file { display:flex; gap:8px; margin-bottom:8px; }
.fopen { flex:1; display:flex; gap:8px; align-items:center; text-align:right; flex-wrap:wrap; }
.fopen b { font-weight:500; flex:1; word-break:break-word; }
.fopen em { font-style:normal; font-size:12px; color:var(--ok); }
.upl { display:block; text-align:center; padding:12px; border-radius:10px; cursor:pointer; }
.pills { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; scrollbar-width:none; }
.pills button { flex:0 0 auto; padding:7px 11px; font-size:13px; border:1px solid var(--line); background:transparent; color:var(--mut); }
.pills button.seen { color:var(--tx); } .pills button.on { background:var(--acc); color:#1a1300; border-color:var(--acc); font-weight:700; }
.sech { margin-top:0; }
.simple p { font-size:17px; line-height:1.85; margin:0 0 12px; }
.simple .ana { background:rgba(79,195,195,.08); border-right:3px solid #4fc3c3; padding:10px 12px; border-radius:8px; }
.pic { margin-top:6px; }
.syms { display:flex; flex-direction:column; gap:6px; }
.sym { display:grid; grid-template-columns:64px 1fr auto; gap:10px; align-items:center; background:var(--bg); border-radius:8px; padding:8px 10px; }
.sym b { color:var(--acc); font-size:18px; text-align:center; direction:ltr; }
.sym span { font-size:14px; line-height:1.6; }
.sym em { font-style:normal; font-size:12px; color:var(--mut); direction:ltr; white-space:nowrap; }
.sym b bdi[dir=ltr], .sym em bdi[dir=ltr] { background:none; border:0; padding:0; }
.qz { border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:10px; }
.why { background:var(--bg); border-radius:8px; padding:8px 10px; font-size:14px; line-height:1.8; }
.search { width:100%; background:var(--bg); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; margin-bottom:8px; }
.sch { direction:ltr; unicode-bidi:isolate; width:100%; height:auto; background:var(--bg); border-radius:10px; }
.sch .w { fill:none; stroke:var(--tx); stroke-width:1.6; stroke-linejoin:round; }
.sch .h { fill:none; stroke:var(--acc); stroke-width:2.6; }
.sch .h2 { fill:none; stroke:#4fc3c3; stroke-width:2; }
.sch .dsh { fill:none; stroke:var(--mut); stroke-width:1; stroke-dasharray:4 3; }
.sch .core { fill:#3a3f58; stroke:#5a5f7d; }
.sch .gapf { fill:var(--bg); }
.sch .fl { fill:var(--acc); } .sch .fl2 { fill:#4fc3c3; }
.sch text { fill:var(--tx); font-size:11px; font-family:system-ui, Arial, sans-serif; }
.sch text.m { fill:var(--mut); font-size:10px; } .sch text.a { fill:var(--acc); } .sch text.c { fill:#4fc3c3; }
.sch .src { fill:var(--card); stroke:var(--tx); stroke-width:1.6; }
#clock { font-variant-numeric:tabular-nums; color:var(--acc); }
</style>
</head>
<body>
<div id="app"><p>טוען…</p></div>
<script>
// Question generators. Each generator(o) returns {text, parts:[{label,ans,unit,units}], sol}.
// o = optional fixed inputs (used by tests to reproduce official exam answers).
const K = { q: 1.6e-19, e0: 8.85e-14, esi: 11.7, eox: 3.9, ni: 1.5e10, Vt: 0.0259, h: 4.135e-15, c: 2.998e10 };

const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (min, max, step) => +(min + step * Math.floor(Math.random() * ((max - min) / step + 1))).toFixed(6);
const sq = Math.sqrt, ln = Math.log, ex = Math.exp, deg = r => r * 180 / Math.PI;

function fmt(x, s = 3) {
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e5 || a < 1e-3) {
    const e = Math.floor(Math.log10(a)), m = x / 10 ** e;
    return `${+m.toPrecision(s)}×10<sup>${e}</sup>`;
  }
  return String(+x.toPrecision(s));
}
const U = (...u) => u; // unit option lists; first is correct

// ---------------- התקני מל"מ ----------------
const semi = {
  name: 'התקני מל"מ', code: '50006', minutes: 180,
  groups: { bjt: 'BJT', mos: 'MOS-FET', opto: 'התקני אור' },
  topics: {
    alphaBeta: { group: 'bjt', title: 'α ו-β מתוך יחס זרמים', gen(o = {}) {
      const mode = o.mode ?? pick(['IEIC', 'IEIB', 'pct']);
      let a, b, given;
      if (mode === 'IEIC') { const r = o.r ?? pick([1.0033, 1.004, 1.005, 1.01, 1.0125, 1.02]); a = 1 / r; given = `היחס בין זרם הפולט לזרם הקולט, I<sub>E</sub>/I<sub>C</sub>, הוא ${r}.`; }
      else if (mode === 'IEIB') { const r = o.r ?? pick([51, 81, 101, 121, 161, 201]); b = r - 1; a = b / (b + 1); given = `היחס בין זרם הפולט לזרם הבסיס, I<sub>E</sub>/I<sub>B</sub>, הוא ${r}.`; }
      else { const r = o.r ?? pick([95, 97, 98, 98.5, 99, 99.5]); a = r / 100; given = `בפעיל קדמי זרם הקולט הוא ${r}% מזרם הפולט.`; }
      b = a / (1 - a);
      return { text: `טרנזיסטור BJT בפעיל קדמי. ${given} חשבו את α ואת β.`,
        parts: [{ label: 'α', ans: a, unit: '' }, { label: 'β', ans: b, unit: '' }],
        sol: `α = I<sub>C</sub>/I<sub>E</sub> = <b>${fmt(a, 4)}</b><br>β = α/(1−α) = <b>${fmt(b)}</b>` };
    } },
    reverse: { group: 'bjt', title: 'פעיל אחורי: βR, IC, IE', gen(o = {}) {
      const IB = o.IB ?? pick([20, 30, 40, 50, 60, 80]) * 1e-6;
      const useA = o.aR !== undefined || (o.bR === undefined && Math.random() < 0.5);
      const aR = useA ? (o.aR ?? rnd(0.85, 0.93, 0.001)) : null;
      const bR = useA ? aR / (1 - aR) : (o.bR ?? pick([5, 6, 8, 9, 10, 12]));
      const IC = (bR + 1) * IB, IE = bR * IB, a = bR / (bR + 1);
      return { text: `טרנזיסטור NPN בפעיל אחורי. נתון ${useA ? `α<sub>R</sub> = ${aR}` : `β<sub>R</sub> = ${bR}`} ו-I<sub>B</sub> = ${fmt(IB * 1e6)}µA. חשבו ${useA ? 'את β<sub>R</sub>,' : 'את α<sub>R</sub>,'} I<sub>C</sub> ו-I<sub>E</sub>.`,
        parts: [useA ? { label: 'β<sub>R</sub>', ans: bR, unit: '' } : { label: 'α<sub>R</sub>', ans: a, unit: '' },
          { label: 'I<sub>C</sub>', ans: IC * 1e3, unit: 'mA', units: U('mA', 'µA', 'A') },
          { label: 'I<sub>E</sub>', ans: IE * 1e3, unit: 'mA', units: U('mA', 'µA', 'A') }],
        sol: `בפעיל אחורי התפקידים מתחלפים: הקולט מזריק והפולט אוסף.<br>β<sub>R</sub> = α<sub>R</sub>/(1−α<sub>R</sub>) = <b>${fmt(bR)}</b>${useA ? '' : `, α<sub>R</sub> = β<sub>R</sub>/(β<sub>R</sub>+1) = <b>${fmt(a, 4)}</b>`}<br>I<sub>E</sub> = β<sub>R</sub>·I<sub>B</sub> = <b>${fmt(IE * 1e3)} mA</b><br>I<sub>C</sub> = I<sub>E</sub> + I<sub>B</sub> = (β<sub>R</sub>+1)I<sub>B</sub> = <b>${fmt(IC * 1e3)} mA</b>` };
    } },
    baseDoping: { group: 'bjt', title: 'ריכוז סיגים בבסיס', gen(o = {}) {
      const V = o.V ?? pick([0.65, 0.68, 0.7, 0.72, 0.75, 0.78]);
      const n = o.n ?? pick([1e15, 3e15, 1e16, 2e16, 5e16]);
      const Na = K.ni ** 2 / n * ex(V / K.Vt);
      return { text: `NPN בפעיל קדמי, V<sub>BE</sub> = ${V}V. ריכוז נושאי המיעוט בתחילת הבסיס n<sub>B</sub>(x=0) = ${fmt(n)} cm<sup>-3</sup>. חשבו את ריכוז הסיגים בבסיס N<sub>a</sub>.`,
        parts: [{ label: 'N<sub>a</sub>', ans: Na, unit: 'cm⁻³', units: U('cm⁻³', 'm⁻³', 'cm⁻²') }],
        sol: `n<sub>B</sub>(0) = n<sub>B0</sub>·e<sup>V<sub>BE</sub>/V<sub>t</sub></sup> = (n<sub>i</sub>²/N<sub>a</sub>)·e<sup>V<sub>BE</sub>/V<sub>t</sub></sup><br>N<sub>a</sub> = n<sub>i</sub>²·e<sup>${V}/0.0259</sup> / ${fmt(n)} = <b>${fmt(Na)} cm<sup>-3</sup></b>` };
    } },
    eiEf: { group: 'mos', title: 'Ei−Ef מתוך ps ב-VFB', gen(o = {}) {
      const ps = o.ps ?? pick([1e4, 1e5, 2.25e4, 1e15, 5e15, 1e16, 1e17]);
      const d = K.Vt * ln(ps / K.ni);
      return { text: `כאשר V<sub>GS</sub> = V<sub>FB</sub> (פסים ישרים) ריכוז החורים בממשק הוא p<sub>s</sub> = ${fmt(ps)} cm<sup>-3</sup>. מה הפער E<sub>i</sub> − E<sub>f</sub> במצע?`,
        parts: [{ label: 'E<sub>i</sub>−E<sub>f</sub>', ans: d, unit: 'eV', units: U('eV', 'V', 'J') }],
        sol: `בפסים ישרים אין כיפוף, לכן p<sub>s</sub> = p<sub>0</sub> במצע.<br>p<sub>0</sub> = n<sub>i</sub>e<sup>(E<sub>i</sub>−E<sub>f</sub>)/kT</sup> ⇒ E<sub>i</sub>−E<sub>f</sub> = kT·ln(p<sub>s</sub>/n<sub>i</sub>) = <b>${fmt(d)} eV</b><br>${d > 0 ? 'חיובי ⇒ מצע P' : 'שלילי ⇒ מצע N'}` };
    } },
    vt: { group: 'mos', title: 'φf, Qdep ומתח סף VT', gen(o = {}) {
      const N = o.N ?? pick([1e15, 5e15, 1e16, 2e16, 5e16]);
      const VFB = o.VFB ?? pick([-0.8, -0.6, -0.5, 0, 0.4, 0.6]);
      const Cox = (o.Cox ?? pick([50, 78, 80, 100, 120])) * 1e-9;
      const p = o.type ? o.type === 'n' : Math.random() < 0.7;
      const pf = K.Vt * ln(N / K.ni), Q = sq(4 * K.e0 * K.esi * K.q * N * pf);
      const VT = p ? VFB + Q / Cox + 2 * pf : VFB - Q / Cox - 2 * pf;
      return { text: `${p ? 'NMOS (מצע P' : 'PMOS (מצע N'}, ריכוז ${fmt(N)} cm<sup>-3</sup>), V<sub>FB</sub> = ${VFB}V, C<sub>ox</sub> = ${fmt(Cox * 1e9)} nF/cm². חשבו |φ<sub>f</sub>|, |Q<sub>dep,max</sub>| ו-V<sub>T</sub>.`,
        parts: [{ label: '|φ<sub>f</sub>|', ans: pf, unit: 'V', units: U('V', 'eV', 'mV') },
          { label: '|Q<sub>dep,max</sub>|', ans: Q * 1e9, unit: 'nC/cm²', units: U('nC/cm²', 'µC/cm²', 'nF/cm²') },
          { label: 'V<sub>T</sub>', ans: VT, unit: 'V', units: U('V', 'mV', 'eV') }],
        sol: `|φ<sub>f</sub>| = V<sub>t</sub>·ln(N/n<sub>i</sub>) = <b>${fmt(pf)} V</b><br>|Q<sub>dep,max</sub>| = √(4ε<sub>0</sub>ε<sub>si</sub>qN|φ<sub>f</sub>|) = <b>${fmt(Q * 1e9)} nC/cm²</b><br>V<sub>T</sub> = V<sub>FB</sub> ${p ? '+' : '−'} |Q<sub>dep</sub>|/C<sub>ox</sub> ${p ? '+' : '−'} 2|φ<sub>f</sub>| = <b>${fmt(VT)} V</b>` };
    } },
    tox: { group: 'mos', title: 'tox מתוך Cox', gen(o = {}) {
      const C = (o.C ?? pick([78, 80, 100, 172.6, 238, 345])) * 1e-9;
      const t = K.e0 * K.eox / C;
      return { text: `צפיפות הקיבול של קבל MOS בהצטברות היא ${fmt(C * 1e9)} nF/cm². חשבו את עובי התחמוצת. (באיזה מצב נוסף C<sub>mos</sub> = C<sub>ox</sub>? בהיפוך חזק בתדר נמוך.)`,
        parts: [{ label: 't<sub>ox</sub>', ans: t * 1e8, unit: 'Å', units: U('Å', 'nm', 'cm') }],
        sol: `בהצטברות C<sub>mos</sub> = C<sub>ox</sub> = ε<sub>0</sub>ε<sub>ox</sub>/t<sub>ox</sub><br>t<sub>ox</sub> = 8.85×10<sup>-14</sup>·3.9 / ${fmt(C)} = ${fmt(t)} cm = <b>${fmt(t * 1e8)} Å</b>` };
    } },
    xd: { group: 'mos', title: 'רוחב מחסור וקיבול Cmos', gen(o = {}) {
      const N = o.N ?? pick([1e15, 5e15, 1e16, 2e16]);
      const k = o.k ?? pick([1, 1.5, 2]);
      const Cox = (o.Cox ?? pick([50, 80, 100])) * 1e-9;
      const pf = K.Vt * ln(N / K.ni), ps = k * pf;
      const Xd = sq(2 * K.e0 * K.esi * ps / (K.q * N)), Cs = K.e0 * K.esi / Xd, Cm = Cox * Cs / (Cox + Cs);

const NS = 'http://www.w3.org/2000/svg';
function plot(box, o) {
  const W = 340, H = 220, L = 46, R = 12, T = 12, B = 34;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'plot'); svg.setAttribute('dir', 'ltr');
  box.append(svg);
  const P = {
    X: x => L + (x - o.x[0]) / (o.x[1] - o.x[0]) * (W - L - R),
    Y: y => H - B - (y - o.y[0]) / (o.y[1] - o.y[0]) * (H - T - B),
    el(tag, at, txt) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt !== undefined) e.textContent = txt; svg.append(e); return e; },
    clear() { svg.innerHTML = ''; axes(); },
    path(pts, cls = 'c1') { const d = pts.filter(p => isFinite(p[1])).map((p, i) => (i ? 'L' : 'M') + P.X(p[0]).toFixed(1) + ' ' + P.Y(Math.max(o.y[0], Math.min(o.y[1], p[1]))).toFixed(1)).join(''); return P.el('path', { d, class: 'ln ' + cls }); },
    fn(f, cls, a = o.x[0], b = o.x[1], n = 160) { const pts = []; for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; pts.push([x, f(x)]); } return P.path(pts, cls); },
    dot(x, y, label, cls = 'c2', dx = 6, dy = -6) { P.el('circle', { cx: P.X(x), cy: P.Y(y), r: 4, class: 'pt ' + cls }); if (label) P.el('text', { x: P.X(x) + dx, y: P.Y(y) + dy, class: 'lbl ' + cls }, label); },
    hline(y, label, cls = 'c3') { P.el('line', { x1: P.X(o.x[0]), x2: P.X(o.x[1]), y1: P.Y(y), y2: P.Y(y), class: 'dash ' + cls }); if (label) P.el('text', { x: P.X(o.x[1]) - 4, y: P.Y(y) - 4, class: 'lbl ' + cls, 'text-anchor': 'end' }, label); },
    vline(x, label, cls = 'c3') { P.el('line', { x1: P.X(x), x2: P.X(x), y1: P.Y(o.y[0]), y2: P.Y(o.y[1]), class: 'dash ' + cls }); if (label) P.el('text', { x: P.X(x) + 4, y: T + 12, class: 'lbl ' + cls }, label); },
    arrow(x1, y1, x2, y2, cls = 'c1', label, dx = 4, dy = -4) { const X1 = P.X(x1), Y1 = P.Y(y1), X2 = P.X(x2), Y2 = P.Y(y2), a = Math.atan2(Y2 - Y1, X2 - X1), h = 7;
      if (Math.hypot(X2 - X1, Y2 - Y1) < 1) return; P.el('line', { x1: X1, y1: Y1, x2: X2, y2: Y2, class: 'ln ' + cls });
      P.el('polygon', { points: `${X2},${Y2} ${X2 - h * Math.cos(a - 0.4)},${Y2 - h * Math.sin(a - 0.4)} ${X2 - h * Math.cos(a + 0.4)},${Y2 - h * Math.sin(a + 0.4)}`, class: 'pt ' + cls });
      if (label) P.el('text', { x: X2 + dx, y: Y2 + dy, class: 'lbl ' + cls }, label); },
    rect(x, y, w, h, cls = 'bar b0') { P.el('rect', { x: P.X(x), y: P.Y(y + h), width: Math.max(0, P.X(x + w) - P.X(x)), height: Math.max(0, P.Y(y) - P.Y(y + h)), class: cls }); },
    area(f, a, b, cls = 'c1') { const pts = []; for (let i = 0; i <= 60; i++) { const x = a + (b - a) * i / 60; pts.push(`${P.X(x)},${P.Y(Math.min(o.y[1], f(x)))}`); } P.el('polygon', { points: `${P.X(a)},${P.Y(o.y[0])} ${pts.join(' ')} ${P.X(b)},${P.Y(o.y[0])}`, class: 'fill ' + cls }); },
  };
  function axes() {
    P.el('line', { x1: L, x2: W - R, y1: H - B, y2: H - B, class: 'ax' }); P.el('line', { x1: L, x2: L, y1: T, y2: H - B, class: 'ax' });
    P.el('text', { x: W - R, y: H - 6, class: 'axl', 'text-anchor': 'end' }, o.xl); P.el('text', { x: 4, y: T + 4, class: 'axl' }, o.yl);

    (o.yt || []).forEach(t => P.el('text', { x: L - 4, y: P.Y(t[0]) + 4, class: 'tick', 'text-anchor': 'end' }, t[1]));
  }
  axes();
  return P;
}
// sliders: [{k,label,min,max,step,v,f}] → calls draw(values) on every change
function sliders(box, defs, draw) {
  const wrap = document.createElement('div'); wrap.className = 'sliders'; box.append(wrap);
  const out = document.createElement('div'); out.className = 'readout'; box.append(out);
  const val = {};
  defs.forEach(d => {
    val[d.k] = d.v;
    const r = document.createElement('label');
    r.innerHTML = `<span>${d.label}</span><input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.v}"><b></b>`;
    const inp = r.querySelector('input'), b = r.querySelector('b');
    const show = () => b.innerHTML = d.f ? d.f(+inp.value) : inp.value;
    inp.oninput = () => { val[d.k] = +inp.value; show(); out.innerHTML = draw(val) || ''; isolateMath(out); };
    show(); wrap.append(r);
  });
  out.innerHTML = draw(val) || ''; isolateMath(out);
}

Ls.baseDoping = {

  body: `<p>בשיווי משקל, ריכוז האלקטרונים בבסיס P הוא n<sub>B0</sub> = n<sub>i</sub>²/N<sub>a</sub> (קטן מאוד).</p>

Ls.eiEf = {
  intro: 'המרחק בין רמת פרמי לרמה האינטרינזית אומר מה סוג המל"מ ומה הסימום שלו.',
  body: `<p>E<sub>i</sub> נמצאת בערך באמצע הפער. E<sub>f</sub> זזה לפי הסימום:</p>
<p class="f">p<sub>0</sub> = n<sub>i</sub>·e<sup>(E<sub>i</sub>−E<sub>f</sub>)/kT</sup> &nbsp;⇒&nbsp; E<sub>i</sub>−E<sub>f</sub> = kT·ln(p<sub>0</sub>/n<sub>i</sub>)</p>
<ul><li>E<sub>f</sub> <b>מתחת</b> ל-E<sub>i</sub> (חיובי) ⇒ יש יותר חורים ⇒ <b>P</b></li><li>E<sub>f</sub> <b>מעל</b> E<sub>i</sub> (שלילי) ⇒ <b>N</b></li></ul>

Ls.vt = {
  intro: 'מתח הסף הוא מתח השער שבו נוצרת תעלה: φ<sub>s</sub> = 2φ<sub>f</sub> (היפוך חזק). הוא סכום של שלושה מרכיבים.',
  body: `<p class="f">V<sub>T</sub> = V<sub>FB</sub> + |Q<sub>dep,max</sub>|/C<sub>ox</sub> + 2|φ<sub>f</sub>| &nbsp;(NMOS, מצע P)</p>
<ol><li><b>V<sub>FB</sub></b> – מבטל את הפרש פונקציות העבודה ואת מטעני התחמוצת (פסים ישרים).</li>
<li><b>2φ<sub>f</sub></b> – כמה צריך לכופף את הפסים עד שבממשק יש יותר אלקטרונים מחורים במצע.</li>
<li><b>Q<sub>dep</sub>/C<sub>ox</sub></b> – המתח שנופל על התחמוצת כדי "להחזיק" את מטען שכבת המחסור.</li></ol>
<p class="f">φ<sub>f</sub> = V<sub>t</sub>ln(N/n<sub>i</sub>) · |Q<sub>dep,max</sub>| = √(4ε<sub>0</sub>ε<sub>si</sub>qNφ<sub>f</sub>)</p>
<p><b>ב-PMOS (מצע N):</b> כל הסימנים מתהפכים: V<sub>T</sub> = V<sub>FB</sub> − |Q<sub>dep</sub>|/C<sub>ox</sub> − 2|φ<sub>f</sub>|.</p>
<p><b>מספרים לזכור (N=10<sup>16</sup>):</b> φ<sub>f</sub> = 0.347V, 2φ<sub>f</sub> = 0.694V, |Q<sub>dep</sub>| = 47.95 nC/cm².</p>`,
  graph(box) {
    const P = plot(box, { x: [14, 18], y: [-1, 4], xl: 'log N', yl: 'V_T [V]', xt: [[14, '10¹⁴'], [16, '10¹⁶'], [18, '10¹⁸']], yt: [[-1, '-1'], [0, '0'], [2, '2'], [4, '4']] });
    sliders(box, [{ k: 'c', label: 'C<sub>ox</sub> nF/cm²', min: 20, max: 300, step: 1, v: 80 }, { k: 'fb', label: 'V<sub>FB</sub>', min: -1, max: 1, step: 0.05, v: -0.8 }, { k: 'n', label: 'log N', min: 14, max: 18, step: 0.1, v: 16 }], v => {
      P.clear(); const vt = x => { const N = e10(x), pf = K.Vt * Math.log(N / K.ni), Q = Math.sqrt(4 * K.e0 * K.esi * K.q * N * pf); return v.fb + Q / (v.c * 1e-9) + 2 * pf; };
      P.fn(vt, 'c1'); P.hline(0, '', 'c4'); P.dot(v.n, vt(v.n), 'V_T');
      const N = e10(v.n), pf = K.Vt * Math.log(N / K.ni), Q = Math.sqrt(4 * K.e0 * K.esi * K.q * N * pf);
      return `V<sub>FB</sub> ${v.fb} + Q/C<sub>ox</sub> ${(Q / (v.c * 1e-9)).toFixed(3)} + 2φ<sub>f</sub> ${(2 * pf).toFixed(3)} = <b>${vt(v.n).toFixed(3)} V</b><br>תחמוצת דקה (C<sub>ox</sub> גדול) ⇒ V<sub>T</sub> קטן`;
    });
  },
  ex: { src: 'תשפ"ה סמ\' א מועד א', inputs: { N: 1e16, VFB: -0.8, Cox: 80, type: 'n' } },
  traps: ['שוכחים להכפיל φ<sub>f</sub> ב-2.', 'Q<sub>dep</sub> ב-C/cm² ו-C<sub>ox</sub> ב-F/cm² – לבדוק שהיחידות מצטמצמות ל-V (nC/nF = V).', 'ב-PMOS מקבלים V<sub>T</sub> שלילי. אם יצא חיובי – כנראה טעות סימן.'],
  exam: 'הנושא הכי חוזר: 10 מבחנים. כמעט תמיד N = 10<sup>16</sup>.',

Ls.tox = {
  intro: 'עקומת C–V של קבל MOS: בהצטברות הקבל מתנהג כקבל לוחות רגיל – C<sub>mos</sub> = C<sub>ox</sub>. מזה מחלצים את עובי התחמוצת.',
  body: `<p><b>שלושת האזורים (מצע P):</b></p><ul>
<li><b>הצטברות</b> (V<sub>G</sub> < V<sub>FB</sub>): חורים מצטברים בממשק ⇒ C = C<sub>ox</sub>.</li>
<li><b>מחסור</b>: נוצרת שכבת מחסור ברוחב X<sub>d</sub> – קבל נוסף בטור ⇒ C יורד.</li>
<li><b>היפוך</b> (V<sub>G</sub> > V<sub>T</sub>): בתדר <b>נמוך</b> נושאי המיעוט מספיקים להגיב ⇒ C חוזר ל-C<sub>ox</sub>. בתדר <b>גבוה</b> לא ⇒ C נשאר ב-C<sub>min</sub>.</li></ul>
<p class="f">C<sub>ox</sub> = ε<sub>0</sub>ε<sub>ox</sub>/t<sub>ox</sub> ⇒ t<sub>ox</sub> = 8.85×10<sup>-14</sup>·3.9/C<sub>ox</sub></p>
<p>1Å = 10<sup>-8</sup>cm · 1nm = 10Å.</p>`,
  graph(box) {
    const P = plot(box, { x: [-3, 4], y: [0, 1.1], xl: 'V_G [V]', yl: 'C/C_ox', xt: [[-2, '-2'], [0, '0'], [2, '2'], [4, '4']], yt: [[0, '0'], [0.5, '0.5'], [1, '1']] });
    sliders(box, [{ k: 't', label: 't<sub>ox</sub> Å', min: 100, max: 1000, step: 10, v: 442 }], v => {
      P.clear(); const N = 1e16, Cox = K.e0 * K.eox / (v.t * 1e-8), pf = K.Vt * Math.log(N / K.ni), es = K.e0 * K.esi;
      const VG = ps => ps + Math.sqrt(2 * es * K.q * N * ps) / Cox, Cm = ps => { const Cs = es / Math.sqrt(2 * es * ps / (K.q * N)); return Cs * Cox / (Cs + Cox) / Cox; };
      const VT = VG(2 * pf), cmin = Cm(2 * pf), dep = [], lf = [];
      for (let i = 1; i <= 80; i++) { const ps = 2 * pf * i / 80; dep.push([VG(ps), Cm(ps)]); }
      P.path([[-3, 1], [-0.3, 0.98], ...dep, [4, cmin]], 'c1');
      P.path([[VT, cmin], [VT + 0.4, 0.8], [VT + 1, 0.97], [4, 1]], 'c2');
      P.vline(0, 'V_FB'); P.vline(VT, 'V_T');
      return `C<sub>ox</sub> = ${(Cox * 1e9).toFixed(1)} nF/cm² · V<sub>T</sub> ≈ ${VT.toFixed(2)}V (V<sub>FB</sub>=0) · C<sub>min</sub>/C<sub>ox</sub> = ${cmin.toFixed(2)}<br><span class="c1t">━ תדר גבוה</span> &nbsp; <span class="c2t">━ תדר נמוך</span>`;
    });
  },
  ex: { src: 'תשפ"ה סמ\' א מועד ב', inputs: { C: 78 } },
  traps: ['C<sub>ox</sub> נתון ב-nF/cm² – להכפיל ב-10<sup>-9</sup> לפני החילוק.', 'בהיפוך חזק בתדר גבוה C ≠ C<sub>ox</sub>. רק בתדר נמוך.', 'לציין את התשובה ב-Å או nm כמו שהשאלה מבקשת.'],
  exam: '6 מבחנים, לרוב יחד עם זיהוי האזור בעקומת C–V.',
};
Ls.xd = {
  intro: 'שכבת המחסור גדלה עם המתח על המל"מ (φ<sub>s</sub>) עד שמגיעים להיפוך חזק – ושם היא נעצרת ב-X<sub>dT</sub>.',
  body: `<p class="f">X<sub>d</sub> = √(2ε<sub>0</sub>ε<sub>si</sub>φ<sub>s</sub>/(qN)) · Q<sub>dep</sub> = −qNX<sub>d</sub> · C<sub>s</sub> = ε<sub>0</sub>ε<sub>si</sub>/X<sub>d</sub></p>
<p>בהיפוך חזק φ<sub>s</sub> = 2φ<sub>f</sub> ⇒ <span class="f">X<sub>dT</sub> = √(4ε<sub>0</sub>ε<sub>si</sub>φ<sub>f</sub>/(qN))</span>. מעבר לזה כל מטען נוסף נכנס לתעלה ולא לשכבת המחסור.</p>
<p>הקיבול הכולל הוא <b>שני קבלים בטור</b>: 1/C<sub>mos</sub> = 1/C<sub>ox</sub> + 1/C<sub>s</sub>. ב-X<sub>dT</sub> מתקבל C<sub>min</sub> (תדר גבוה).</p>
<p><b>זכור:</b> N=10<sup>16</sup> ⇒ X<sub>dT</sub> ≈ 300nm.</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 0.9], y: [0, 1200], xl: 'φ_s [V]', yl: 'X_d [nm]', xt: [[0, '0'], [0.3, '0.3'], [0.6, '0.6'], [0.9, '0.9']], yt: [[0, '0'], [400, '400'], [800, '800'], [1200, '1200']] });

      P.clear(); const N = e10(v.n), pf = K.Vt * Math.log(N / K.ni), X = ps => Math.sqrt(2 * K.e0 * K.esi * ps / (K.q * N)) * 1e7;
      P.fn(X, 'c1', 0, 2 * pf); P.path([[2 * pf, X(2 * pf)], [0.9, X(2 * pf)]], 'c3'); P.vline(2 * pf, '2φf'); P.dot(v.k * pf, X(v.k * pf), 'X_d');
      return `φ<sub>f</sub> = ${pf.toFixed(3)}V · X<sub>d</sub> = ${X(v.k * pf).toFixed(0)}nm · X<sub>dT</sub> = ${X(2 * pf).toFixed(0)}nm<br>סימום גבוה יותר ⇒ שכבת מחסור צרה יותר`;
    });
  },
  ex: { src: 'תשפ"ה סמ\' א מועד א', inputs: { N: 1e16, k: 1.5, Cox: 80 } },
  traps: ['להשתמש ב-4ε (של X<sub>dT</sub>) כשהשאלה נותנת φ<sub>s</sub> אחר – אז חוזרים ל-2εφ<sub>s</sub>.', 'X<sub>d</sub> יוצא ב-cm – להמיר ל-nm (×10<sup>7</sup>).'],
  exam: '7 מבחנים, בדרך כלל יחד עם Q<sub>dep</sub> ו-C<sub>mos</sub>.',
};
Ls.ids = {
  intro: 'אופיין הזרם של MOSFET: עד נקודת הצביטה הזרם עולה (תחום ליניארי), ומעבר לה הוא קבוע (רוויה).',
  body: `<table class="t"><tr><th>תחום</th><th>תנאי</th><th>זרם</th></tr>
<tr><td>קטעון</td><td>V<sub>GS</sub> ≤ V<sub>T</sub></td><td>0</td></tr>
<tr><td>ליניארי</td><td>V<sub>DS</sub> < V<sub>GS</sub>−V<sub>T</sub></td><td>K[(V<sub>GS</sub>−V<sub>T</sub>)V<sub>DS</sub> − V<sub>DS</sub>²/2]</td></tr>
<tr><td>רוויה</td><td>V<sub>DS</sub> ≥ V<sub>GS</sub>−V<sub>T</sub></td><td>½K(V<sub>GS</sub>−V<sub>T</sub>)²</td></tr></table>
<p>K = μC<sub>ox</sub>W/L. <b>V<sub>DS(sat)</sub> = V<sub>GS</sub> − V<sub>T</sub></b> – זו "נקודת הצביטה", שבה התעלה נסגרת בצד ה-Drain.</p>
<p><b>שיטה במבחן:</b> קודם מחשבים V<sub>DS(sat)</sub>, משווים ל-V<sub>DS</sub> הנתון, ורק אז בוחרים נוסחה.</p>
<p>ב-PMOS הכול בערכים מוחלטים והזרם בכיוון הפוך.</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 3], y: [0, 4], xl: 'V_DS [V]', yl: 'I_DS [mA]', xt: [[0, '0'], [1, '1'], [2, '2'], [3, '3']], yt: [[0, '0'], [2, '2'], [4, '4']] });
    sliders(box, [{ k: 'vt', label: 'V<sub>T</sub>', min: 0.3, max: 1.5, step: 0.05, v: 0.5 }, { k: 'vg', label: 'V<sub>GS</sub>', min: 0.5, max: 3, step: 0.1, v: 2 }, { k: 'k', label: 'K mA/V²', min: 0.5, max: 3, step: 0.1, v: 2 }], v => {
      P.clear(); const I = (vg, vd) => { const s = vg - v.vt; if (s <= 0) return 0; return vd < s ? v.k * (s * vd - vd * vd / 2) : 0.5 * v.k * s * s; };
      for (let g = v.vt + 0.5; g <= 3.01; g += 0.5) P.fn(x => I(g, x), 'c4');
      P.fn(x => 0.5 * v.k * x * x, 'c3'); P.fn(x => I(v.vg, x), 'c1');
      const s = Math.max(0, v.vg - v.vt); P.dot(s, I(v.vg, s), 'pinch-off');
      return `V<sub>DS(sat)</sub> = ${s.toFixed(2)}V · I<sub>DS(max)</sub> = ${(0.5 * v.k * s * s).toFixed(2)}mA<br>הקו המקווקו = מקום כל נקודות הצביטה (½K·V<sub>DS</sub>²)`;
    });
  },
  ex: { src: 'דוגמה בסגנון המבחנים', inputs: { VT: 1.31, VGS: 1.5, K: 2e-3, VDS: 0.1 } },
  traps: ['להשתמש בנוסחת הרוויה כש-V<sub>DS</sub> קטן מ-V<sub>DS(sat)</sub>.', 'לשכוח את ה-½ בנוסחת הרוויה.', 'K נתון ב-A/V² או mA/V² – לבדוק.'],
  exam: 'כמעט בכל מבחן, בסוף שאלת MOS (5–10%).',
};
Ls.absorb = {
  intro: 'עוצמת האור דועכת אקספוננציאלית בתוך החומר. מקדם הבליעה α אומר כמה מהר.',
  body: `<p class="f">I(x) = I<sub>0</sub>·e<sup>−αx</sup> &nbsp;·&nbsp; נבלע עד עומק d: 1 − e<sup>−αd</sup></p>

<p><b>לגלאי בשכבה דקה</b> רוצים α <b>גבוה</b> – כדי שרוב האור ייבלע בשכבה.</p>

Ls.solar = {
  intro: 'תא שמש = דיודה מוארת. האור יוצר זרם I<sub>L</sub> שמסתובב נגד כיוון זרם הדיודה.',
  body: `<p class="f">I = I<sub>L</sub> − I<sub>s</sub>(e<sup>V/V<sub>t</sub></sup> − 1)</p>
<ul><li><b>קצר (V=0):</b> I<sub>sc</sub> = I<sub>L</sub>.</li><li><b>מעגל פתוח (I=0):</b> V<sub>oc</sub> = V<sub>t</sub>ln(I<sub>L</sub>/I<sub>s</sub> + 1).</li>
<li><b>הספק מקסימלי:</b> הנקודה שבה המלבן V·I הכי גדול (V<sub>m</sub>, I<sub>m</sub>).</li></ul>
<p><b>מה תלוי בהארה?</b> I<sub>L</sub>, I<sub>sc</sub>, I<sub>m</sub> – כן. I<sub>s</sub> (זרם הרוויה של הדיודה) – <b>לא</b>, הוא תלוי רק בחומר ובטמפרטורה.</p>
<p>הגדלת הארה פי 10 ⇒ I<sub>sc</sub> פי 10, אבל V<sub>oc</sub> עולה רק בכ-60mV (לוגריתם).</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 0.75], y: [0, 120], xl: 'V [V]', yl: 'I [mA]', xt: [[0, '0'], [0.25, '0.25'], [0.5, '0.5'], [0.75, '0.75']], yt: [[0, '0'], [50, '50'], [100, '100']] });
    sliders(box, [{ k: 'il', label: 'I<sub>L</sub> mA (הארה)', min: 5, max: 110, step: 1, v: 75 }, { k: 's', label: 'log I<sub>s</sub>', min: -13, max: -10, step: 0.1, v: -11.5, f: x => sci(e10(x)) + 'A' }], v => {
      P.clear(); const Is = e10(v.s) * 1e3, I = V => v.il - Is * (Math.exp(V / K.Vt) - 1), voc = K.Vt * Math.log(v.il / Is + 1);
      let best = [0, 0]; for (let V = 0; V < voc; V += 0.001) if (V * I(V) > best[0] * best[1]) best = [V, I(V)];
      P.el('rect', { x: P.X(0), y: P.Y(best[1]), width: P.X(best[0]) - P.X(0), height: P.Y(0) - P.Y(best[1]), class: 'fill c2' });
      P.fn(V => I(V) >= 0 ? I(V) : NaN, 'c1', 0, voc); P.dot(0, v.il, 'I_sc', 'c1', 6, 14); P.dot(voc, 0, 'V_oc', 'c1', -30, -8); P.dot(best[0], best[1], 'P_max');
      return `I<sub>sc</sub> = ${v.il}mA · V<sub>oc</sub> = <b>${voc.toFixed(3)}V</b> · P<sub>max</sub> = ${(best[0] * best[1]).toFixed(1)}mW (FF ${(best[0] * best[1] / (voc * v.il)).toFixed(2)})`;
    });
  },
  ex: { src: 'תשע"ז מועד א / תשפ"ב', inputs: { mode: 'isc', Voc: 0.62, Is: 3e-12 } },
  traps: ['להפוך את סימן I<sub>L</sub> – בקורס I<sub>L</sub> חיובי והדיודה מחסירה.', 'לחשוב ש-I<sub>s</sub> תלוי בהארה.', 'לשכוח להוסיף 1 בתוך הלוגריתם כשמחשבים V<sub>oc</sub> מ-I<sub>L</sub> קטן.'],
  exam: 'הנושא הכי חוזר באופטו: 12 מבחנים.',
};
Ls.crit = {
  intro: 'רוב האור שנוצר ב-LED לא יוצא, כי הוא פוגע בגבול עם האוויר בזווית גדולה מהזווית הקריטית ומוחזר פנימה.',
  body: `<p class="f">sinθ<sub>c</sub> = n<sub>2</sub>/n<sub>1</sub> &nbsp;·&nbsp; ניצולת הזווית הקריטית: η<sub>c</sub> = ½(1 − cosθ<sub>c</sub>)</p>
<p>רק אור בתוך "חרוט היציאה" (זווית < θ<sub>c</sub>) יוצא. ל-GaAs (n=3.66) לאוויר: θ<sub>c</sub> ≈ 15.8° ⇒ רק ~1.9% יוצא מפאה אחת.</p>
<p><b>פתרונות:</b> כיפה מפלסטיק (מקדם שבירה ביניים – מגדיל θ<sub>c</sub>), ציפוי נגד החזרה (מקטין הפסדי פרנל), צורת שבב.</p>
<p><b>הפסד פרנל:</b> גם בזווית ישרה חלק מוחזר: R = ((n<sub>1</sub>−n<sub>2</sub>)/(n<sub>1</sub>+n<sub>2</sub>))².</p>`,
  graph(box) {
    const P = plot(box, { x: [-1.2, 1.2], y: [-1, 1.2], xl: '', yl: '' });
    sliders(box, [{ k: 'n1', label: 'n<sub>1</sub> (מל"מ)', min: 1.5, max: 4, step: 0.01, v: 3.66 }, { k: 'n2', label: 'n<sub>2</sub> (תווך)', min: 1, max: 1.6, step: 0.01, v: 1 }], v => {
      P.clear(); const th = Math.asin(Math.min(1, v.n2 / v.n1)), eta = (1 - Math.cos(th)) / 2;
      P.path([[-1.2, 0], [1.2, 0]], 'c4'); P.el('text', { x: P.X(-1.1), y: P.Y(0.1), class: 'lbl' }, 'n2'); P.el('text', { x: P.X(-1.1), y: P.Y(-0.15), class: 'lbl' }, 'n1');
      P.el('polygon', { points: `${P.X(0)},${P.Y(-0.9)} ${P.X(Math.tan(th) * 0.9)},${P.Y(0)} ${P.X(-Math.tan(th) * 0.9)},${P.Y(0)}`, class: 'fill c2' });
      P.path([[0, -0.9], [Math.tan(th) * 0.9, 0]], 'c2'); P.path([[0, -0.9], [-Math.tan(th) * 0.9, 0]], 'c2');
      P.path([[0, -0.9], [0.9, 0], [1.2, -0.3]], 'c3'); P.dot(0, -0.9, 'מקור');
      const R = ((v.n1 - v.n2) / (v.n1 + v.n2)) ** 2;
      return `θ<sub>c</sub> = <b>${(th * 180 / Math.PI).toFixed(1)}°</b> · η<sub>c</sub> = ${(eta * 100).toFixed(2)}% · פרנל R = ${(R * 100).toFixed(1)}%<br>הקרן הצהובה פוגעת בזווית גדולה ⇒ החזרה מלאה`;
    });
  },
  ex: { src: 'תשפ"א מועד ב', inputs: { n1: 3.66, n2: 1 } },
  traps: ['להפוך n<sub>1</sub>/n<sub>2</sub> – מקבלים sin > 1.', 'מחשבון במצב רדיאנים.'],
  exam: '5 מבחנים, לרוב יחד עם "איזה מבנה משפר את הניצולת".',
};

Le.parallel = {
  intro: 'כששני שנאים עובדים במקביל, העומס לא מתחלק לפי ההספק הנומינלי אלא לפי מתח הקצר: השנאי ה"קשיח" יותר (v<sub>sc</sub> נמוך) לוקח יותר.',
  body: `<p>שני השנאים מחוברים לאותו מתח, ולכן מפל המתח עליהם שווה. מפל המתח ∝ β·v<sub>sc</sub> (β = מקדם העומס) ⇒ β<sub>1</sub>v<sub>sc1</sub> = β<sub>2</sub>v<sub>sc2</sub>.</p>
<p class="f">S<sub>α</sub> = S<sub>T</sub>·S<sub>n.α</sub> / (v<sub>sc.α</sub>[S<sub>n.α</sub>/v<sub>sc.α</sub> + S<sub>n.β</sub>/v<sub>sc.β</sub>])</p>
<p><b>שלבים:</b></p><ol><li>S<sub>T</sub> = P/cosφ.</li><li>מחשבים את המכנה.</li><li>S לכל שנאי.</li><li>משווים ל-S<sub>n</sub> – מי בעומס יתר?.</li></ol>
<p><b>תנאים לחיבור במקביל:</b> אותו יחס השנאה, אותה קבוצת חיבור (שעון), ו-v<sub>sc</sub> קרובים (עד ~10% הפרש).</p>
<p><b>העומס המקסימלי</b> בלי עומס יתר: השנאי עם v<sub>sc</sub> הנמוך מגיע ראשון ל-100%.</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 4], y: [0, 1.5], xl: '', yl: 'S/Sn', yt: [[0, '0'], [0.5, '50%'], [1, '100%'], [1.5, '150%']] });
    sliders(box, [{ k: 'v1', label: 'v<sub>sc1</sub>%', min: 3, max: 8, step: 0.1, v: 5.5 }, { k: 'v2', label: 'v<sub>sc2</sub>%', min: 3, max: 8, step: 0.1, v: 6 }, { k: 'st', label: 'S<sub>T</sub> kVA', min: 20, max: 200, step: 1, v: 125 }], v => {
      P.clear(); const S1 = 100, S2 = 40, D = S1 / v.v1 + S2 / v.v2, a = v.st / (v.v1 * D), b = v.st / (v.v2 * D);

      [[a, 'T1 100kVA'], [b, 'T2 40kVA']].forEach(([y, n], i) => {
        P.el('rect', { x: P.X(0.6 + i * 1.6), y: P.Y(Math.min(y, 1.5)), width: 60, height: P.Y(0) - P.Y(Math.min(y, 1.5)), class: 'bar ' + (y > 1 ? 'bad' : 'b' + i) });
        P.el('text', { x: P.X(0.6 + i * 1.6) + 30, y: P.Y(0) + 14, class: 'tick', 'text-anchor': 'middle' }, n);
      });
      const max = Math.min(v.v1, v.v2) * D;
      return `S<sub>1</sub> = ${(a * S1).toFixed(1)} kVA (${(a * 100).toFixed(0)}%) · S<sub>2</sub> = ${(b * S2).toFixed(1)} kVA (${(b * 100).toFixed(0)}%)<br>עומס מקסימלי בלי עומס יתר: <b>${max.toFixed(1)} kVA</b> (פחות מ-140!)`;
    });

  ex: { src: 'תשע"א סמ\' א מועד א', inputs: { S1: 100, v1: 5.5, S2: 40, v2: 6, P: 100, cos: 0.8 } },
  traps: ['לחלק לפי S<sub>n</sub> בלבד (100:40) ולהתעלם מ-v<sub>sc</sub>.', 'לשכוח ש-P ב-kW ו-S ב-kVA: S<sub>T</sub> = P/cosφ.'],
  exam: 'שאלה 1 כמעט בכל מבחן של אקסלרוד, כולל "האם אפשר לחבר עומס נוסף".',

Le.regulation = {
  intro: 'שני מספרים מאפיינים שנאי בעומס: כמה המתח יורד (ויסות) וכמה הספק הולך לאיבוד (נצילות).',
  body: `<p><b>מניסוי קצר</b> מקבלים ΔP<sub>Cu.n</sub> ו-v<sub>sc</sub>; <b>מניסוי ריקם</b> – ΔP<sub>Fe</sub> ו-I<sub>0</sub>.</p>
<p class="f">v<sub>r</sub>% = ΔP<sub>Cu.n</sub>/S<sub>n</sub>·100 · v<sub>x</sub>% = √(v<sub>sc</sub>² − v<sub>r</sub>²)</p>
<p class="f">Δv% = β(v<sub>r</sub>cosφ + v<sub>x</sub>sinφ)</p>
<p class="f">η = βS<sub>n</sub>cosφ / (βS<sub>n</sub>cosφ + ΔP<sub>Fe</sub> + β²ΔP<sub>Cu.n</sub>)</p>
<p><b>נצילות מקסימלית</b> כשהפסדי הנחושת = הפסדי הברזל: β<sub>opt</sub> = √(ΔP<sub>Fe</sub>/ΔP<sub>Cu.n</sub>).</p>
<p>בעומס קיבולי sinφ שלילי ⇒ Δv יכול להיות שלילי (המתח <b>עולה</b>).</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 1.3], y: [90, 100], xl: 'β', yl: 'η %', xt: [[0, '0'], [0.5, '0.5'], [1, '1'], [1.3, '1.3']], yt: [[90, '90'], [95, '95'], [100, '100']] });
    sliders(box, [{ k: 'r', label: 'ΔP<sub>Fe</sub>/ΔP<sub>Cu</sub>', min: 0.1, max: 1, step: 0.05, v: 0.4 }, { k: 'cu', label: 'ΔP<sub>Cu.n</sub> % מ-S<sub>n</sub>', min: 0.5, max: 3, step: 0.1, v: 1.5 }, { k: 'c', label: 'cosφ', min: 0.6, max: 1, step: 0.05, v: 0.8 }], v => {

      P.fn(b => eta(b), 'c1', 0.01, 1.3); P.vline(bo, 'β_opt'); P.dot(bo, eta(bo), (eta(bo)).toFixed(2) + '%');
      return `β<sub>opt</sub> = √(${v.r}) = <b>${bo.toFixed(2)}</b> · η<sub>max</sub> = ${eta(bo).toFixed(2)}% · η בעומס מלא = ${eta(1).toFixed(2)}%`;
    });
  },
  ex: { src: 'דוגמה בסגנון המבחנים', inputs: { Sn: 100, vsc: 5, Pcu: 1.5, PFe: 0.6, b: 0.75, cos: 0.8 } },
  traps: ['להכפיל ΔP<sub>Cu</sub> ב-β במקום ב-β².', 'להציב cosφ גם במקום sinφ.', 'בתלת-פאזי: S<sub>n</sub> הוא ההספק הכולל, לא לפאזה.'],
  exam: 'מופיע כסעיף בשאלת השנאים ברוב המבחנים.',
};
Le.equiv = {
  intro: 'מעגל התמורה של השנאי מחליף אותו במעגל של נגדים וסלילים. מניסויי ריקם וקצר מוצאים את הפרמטרים שלו.',
  body: `<div class="circ">${circuitSVG()}</div>
<p><b>ענף טורי</b> (R<sub>1</sub>+R'<sub>2</sub>, X<sub>1</sub>+X'<sub>2</sub>): הפסדי נחושת ושטף פיזור – נמדד ב<b>ניסוי קצר</b> (מתח נמוך, זרם נומינלי).</p>
<p><b>ענף מקבילי</b> (R<sub>C</sub> ∥ X<sub>φ</sub>): הפסדי ברזל וזרם מגנוט – נמדד ב<b>ניסוי ריקם</b> (מתח נומינלי, אין עומס).</p>
<p class="f">ריקם: R<sub>C</sub> = V²/P<sub>0</sub> · I<sub>0</sub> = V√(1/R<sub>C</sub>² + 1/X<sub>φ</sub>²)</p>
<p class="f">קצר: Z<sub>sc</sub> = V<sub>sc</sub>/I<sub>n</sub> · R<sub>sc</sub> = P<sub>sc</sub>/I<sub>n</sub>² · v<sub>sc</sub>% = I<sub>n</sub>|Z<sub>sc</sub>|/V<sub>n</sub>·100</p>
<p>הפניה לצד ראשוני: R'<sub>2</sub> = a²R<sub>2</sub>, a = w<sub>1</sub>/w<sub>2</sub>. "מעגל L" = מזיזים את הענף המקבילי לכניסה – מותר כשהשאלה אומרת זאת.</p>`,
  graph: null,
  ex: { src: 'תש"ע סמ\' ב מועד א', inputs: { Sn: 30, V1: 2400, R: 4.26, X: 7.89, Rc: 19500, Xp: 4962 } },
  traps: ['לחבר את הענף המקבילי בטור.', 'לשכוח להפנות R<sub>2</sub>, X<sub>2</sub> לצד הראשוני (×a²).', 'בתלת-פאזי בכוכב: מתח פאזה = V<sub>line</sub>/√3.'],
  exam: 'שאלה 1 בחלק מהמבחנים (במקום שנאים במקביל).',

Le.induction = {
  intro: 'מנוע השראה מסתובב קצת לאט מהשדה המסתובב. ההפרש היחסי – ההחלקה s – קובע הכול.',
  body: `<p class="f">n<sub>s</sub> = 60f/p · s = (n<sub>s</sub> − n)/n<sub>s</sub></p>
<p>n<sub>s</sub> ב-50Hz: 3000/1500/1000/750 rpm. <b>טריק:</b> אם נתון n<sub>n</sub> = 1425, n<sub>s</sub> הוא הערך הקרוב שמעליו = 1500.</p>
<p class="f">M<sub>n</sub> = P<sub>n</sub>/ω<sub>n</sub>, ω = 2πn/60 · M<sub>max</sub> = λM<sub>n</sub></p>
<p><b>נוסחת קלוס:</b> <span class="f">M = 2M<sub>max</sub>/(s/s<sub>cr</sub> + s<sub>cr</sub>/s)</span> ⇒ מהנקודה הנומינלית: s<sub>cr</sub> = s<sub>n</sub>(λ + √(λ²−1)).</p>
<p><b>זרימת הספק:</b> P<sub>g</sub> (מרווח אוויר) = Mω<sub>s</sub> · ΔP<sub>Cu2</sub> = sP<sub>g</sub> · P<sub>mech</sub> = (1−s)P<sub>g</sub>.</p>
<p>הגדלת נגד ברוטור מגדילה את s<sub>cr</sub> אבל <b>לא</b> משנה את M<sub>max</sub> – כך מגדילים מומנט התנעה.</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 1500], y: [0, 3.2], xl: 'n [rpm]', yl: 'M/Mn', xt: [[0, '0'], [500, '500'], [1000, '1000'], [1500, '1500']], yt: [[0, '0'], [1, '1'], [2, '2'], [3, '3']] });
    sliders(box, [{ k: 'l', label: 'λ', min: 1.5, max: 3.2, step: 0.1, v: 2.5 }, { k: 'n', label: 'n<sub>n</sub>', min: 1350, max: 1480, step: 5, v: 1425 }], v => {
      P.clear(); const sn = (1500 - v.n) / 1500, scr = sn * (v.l + Math.sqrt(v.l ** 2 - 1)), M = n => { const s = (1500 - n) / 1500; return 2 * v.l / (s / scr + scr / s); };
      P.fn(M, 'c1', 0, 1499.9); P.hline(1, 'Mn', 'c4'); P.dot(v.n, 1, 'נומינלי', 'c2', -52, -8); P.dot(1500 * (1 - scr), v.l, 'M_max'); P.dot(0, M(0), 'התנעה', 'c3', 6, 14);
      return `s<sub>n</sub> = ${sn.toFixed(3)} · s<sub>cr</sub> = <b>${scr.toFixed(3)}</b> · n<sub>cr</sub> = ${(1500 * (1 - scr)).toFixed(0)} rpm · M<sub>start</sub> = ${M(0).toFixed(2)}M<sub>n</sub><br>אזור יציב: מימין ל-M<sub>max</sub> (n > n<sub>cr</sub>)`;
    });
  },
  ex: { src: 'תשע"א סמ\' א מועד א', inputs: { ns: 1500, n: 1425, P: 4, lam: 2.5 } },
  traps: ['להציב n ב-rpm במקום ω ב-rad/s בחישוב המומנט.', 'P<sub>n</sub> הוא הספק <b>מכני</b> במוצא.', 'בנוסחת קלוס לקחת את הפתרון הקטן של s (האזור היציב).'],
  exam: 'שאלה 2 בכמעט כל מבחן.',
};
Le.inductionLoad = {
  intro: 'נקודת העבודה של המנוע היא החיתוך בין עקומת המומנט שלו לבין קו העומס.',
  body: `<p>בעומס מומנט קבוע M<sub>L</sub>, פותרים את נוסחת קלוס עבור s:</p>
<p class="f">s = s<sub>cr</sub>(r − √(r² − 1)), r = M<sub>max</sub>/M<sub>L</sub></p>
<p>לוקחים את השורש עם המינוס – זו הנקודה היציבה (בין s=0 ל-s<sub>cr</sub>). אם M<sub>L</sub> > M<sub>max</sub> – המנוע נעצר.</p>
<p><b>קירוב שימושי:</b> באזור העבודה העקומה כמעט ישרה: s ≈ s<sub>n</sub>·M<sub>L</sub>/M<sub>n</sub>.</p>
<p><b>שינוי מתח:</b> M ∝ V² ⇒ ירידה של 10% במתח ⇒ ירידה של 19% במומנט, וההחלקה גדלה.</p>`,
  graph(box) {
    const P = plot(box, { x: [1100, 1500], y: [0, 3], xl: 'n [rpm]', yl: 'M/Mn', xt: [[1100, '1100'], [1300, '1300'], [1500, '1500']], yt: [[0, '0'], [1, '1'], [2, '2'], [3, '3']] });
    sliders(box, [{ k: 'k', label: 'M<sub>L</sub>/M<sub>n</sub>', min: 0.1, max: 2.6, step: 0.05, v: 0.5 }, { k: 'u', label: 'V/V<sub>n</sub>', min: 0.7, max: 1.1, step: 0.01, v: 1 }], v => {
      P.clear(); const sn = 0.05, l = 2.5, scr = sn * (l + Math.sqrt(l * l - 1)), M = n => { const s = (1500 - n) / 1500; return v.u ** 2 * 2 * l / (s / scr + scr / s); };
      P.fn(M, 'c1', 1100, 1499.9); P.hline(v.k, 'M_L', 'c2');
      const r = v.u ** 2 * l / v.k;
      if (r < 1) return '⚠ M<sub>L</sub> > M<sub>max</sub> – המנוע נעצר';
      const s = scr * (r - Math.sqrt(r * r - 1)); P.dot(1500 * (1 - s), v.k, 'נקודת עבודה');
      return `s = ${s.toFixed(4)} · n = <b>${(1500 * (1 - s)).toFixed(0)} rpm</b> · M<sub>max</sub> במתח הזה = ${(v.u ** 2 * l).toFixed(2)}M<sub>n</sub>`;
    });
  },
  ex: { src: 'תשע"א סמ\' א מועד א', inputs: { ns: 1500, n: 1425, lam: 2.5, k: 0.5 } },
  traps: ['לבחור את השורש עם הפלוס – זה האזור הלא יציב.', 'לשכוח ש-M<sub>max</sub> משתנה עם V².'],
  exam: 'סעיף ב\'–ג\' בשאלת מנוע ההשראה.',
};
Le.dcSelf = {
  intro: 'גנרטור DC בעירור עצמי מזין בעצמו את סליל העירור. נקודת העבודה היא החיתוך בין עקומת המגנוט לבין קו נגד העירור.',
  body: `<p class="f">E = V + I<sub>a</sub>R<sub>a</sub> · I<sub>a</sub> = I<sub>f</sub> + I<sub>L</sub> (מקבילי) · I<sub>f</sub> = V/R<sub>f</sub></p>
<p>עקומת המגנוט E(I<sub>f</sub>) נתונה (במבחנים לרוב E = A√I<sub>f</sub>). הקו V = R<sub>f</sub>·I<sub>f</sub> הוא "קו השדה".</p>
<p><b>התנאים לבניית מתח:</b> מגנטיות שארית, חיבור נכון של הסליל, ו-R<sub>f</sub> קטן מ<b>ההתנגדות הקריטית</b> (שיפוע העקומה בהתחלה).</p>
<p><b>שיטת פתרון:</b> מציבים את כל הקשרים במשוואה אחת ב-√I<sub>f</sub> ⇒ משוואה ריבועית ⇒ השורש הקטן (הפיזיקלי).</p>
<p><b>מנוע DC:</b> V = E + I<sub>a</sub>R<sub>a</sub>, ω = (V−I<sub>a</sub>R<sub>a</sub>)/(kΦ). נגד בטור לרוטור ⇒ מהירות יורדת.</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 12], y: [0, 600], xl: 'I_f [A]', yl: 'V [V]', xt: [[0, '0'], [4, '4'], [8, '8'], [12, '12']], yt: [[0, '0'], [200, '200'], [400, '400'], [600, '600']] });
    sliders(box, [{ k: 'a', label: 'A (E=A√I<sub>f</sub>)', min: 100, max: 250, step: 5, v: 200 }, { k: 'rf', label: 'R<sub>f</sub> Ω', min: 20, max: 300, step: 1, v: 89 }], v => {
      P.clear(); P.fn(i => v.a * Math.sqrt(i), 'c1'); P.fn(i => v.rf * i, 'c2');
      const If = (v.a / v.rf) ** 2; P.dot(If, v.rf * If, 'נקודת עבודה');
      return `ללא עומס: I<sub>f</sub> = (A/R<sub>f</sub>)² = ${If.toFixed(2)}A · V ≈ <b>${(v.rf * If).toFixed(0)}V</b><br>R<sub>f</sub> גדול ⇒ קו תלול ⇒ מתח נמוך. בעקומה אמיתית (רוויה) מעל R<sub>f</sub> קריטי המתח לא נבנה.`;
    });
  },
  ex: { src: 'תשע"א סמ\' א מועד א', inputs: { Ra: 0.5, A: 200, RL: 10, V: 400 } },
  traps: ['לשכוח את I<sub>f</sub> בתוך I<sub>a</sub> (I<sub>a</sub> = I<sub>f</sub> + I<sub>L</sub>).', 'לקחת את השורש הגדול של המשוואה הריבועית.'],
  exam: 'שאלה 3 בחלק מהמבחנים (לסירוגין עם סינכרוני).',
};
Le.synch = {
  intro: 'במכונה סינכרונית הקשר בין המתח הפנימי E למתח ההדקים V הוא חיבור וקטורי פשוט – וזווית העומס δ ביניהם קובעת את ההספק.',
  body: `<p class="f">גנרטור: Ẽ = Ṽ + jXĨ &nbsp;·&nbsp; מנוע: Ṽ = Ẽ + jXĨ</p>
<p class="f">P = 3V<sub>ph</sub>I<sub>ph</sub>cosφ = 3V<sub>ph</sub>E<sub>ph</sub>sinδ/X</p>
<p><b>שלבים:</b></p><ol><li>V<sub>ph</sub> = V<sub>L</sub>/√3 (כוכב).</li><li>I = P/(√3V<sub>L</sub>cosφ).</li><li>Ĩ = I∠−φ (השראי) או ∠+φ (קיבולי).</li><li>מחשבים Ẽ ברכיבים: Re = V + XI·sinφ, Im = XI·cosφ.</li></ol>
<p><b>עירור:</b> עירור יתר (E גדול) ⇒ המכונה מספקת הספק היגבי (כמו קבל). עירור חסר ⇒ צורכת.</p>
<p>δ<sub>max</sub> = 90° – מעבר לזה המכונה יוצאת מסינכרון.</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 400], y: [-60, 220], xl: 'Re', yl: 'Im' });
    sliders(box, [{ k: 'phi', label: 'φ° (− קיבולי)', min: -60, max: 60, step: 1, v: 37 }, { k: 'i', label: 'I A', min: 10, max: 100, step: 1, v: 76 }, { k: 'x', label: 'X Ω', min: 0.5, max: 3, step: 0.1, v: 2 }], v => {
      P.clear(); const V = 219.4, ph = v.phi * Math.PI / 180, Ix = v.i * Math.cos(ph), Iy = -v.i * Math.sin(ph);
      const Ex = V - v.x * Iy, Ey = v.x * Ix;
      P.path([[0, 0], [V, 0]], 'c4'); P.path([[0, 0], [Ix, Iy]], 'c3'); P.path([[V, 0], [Ex, Ey]], 'c2'); P.path([[0, 0], [Ex, Ey]], 'c1');
      P.dot(V, 0, 'V', 'c4', 4, 14); P.dot(Ix, Iy, 'I', 'c3'); P.dot(Ex, Ey, 'E', 'c1');
      const E = Math.hypot(Ex, Ey), d = Math.atan2(Ey, Ex) * 180 / Math.PI;
      return `E<sub>ph</sub> = <b>${E.toFixed(1)}V</b> · δ = <b>${d.toFixed(1)}°</b> · ${E > V ? 'עירור יתר' : 'עירור חסר'}<br><span class="c2t">━ jXI</span> מאונך ל-I`;
    });
  },
  ex: { src: 'דוגמה בסגנון המבחנים', inputs: { P: 40, VL: 380, cos: 0.8, X: 2 } },
  traps: ['להשתמש ב-V<sub>L</sub> במקום V<sub>ph</sub>.', 'לשכוח שבמנוע הסימן של jXI הפוך.', 'זווית δ היא בין E ל-V, לא בין I ל-V.'],
  exam: 'שאלה 3 בחלק מהמבחנים: מספרים פשוטים + דיאגרמה וקטורית.',
};

Le.trTests = {
  intro: 'שני ניסויים נותנים את כל ששת הפרמטרים של מעגל התמורה: ניסוי קצר את הענף הטורי, וניסוי ריקם את הענף המקבילי.',
  body: `<p><b>בתלת-פאזי עובדים לפאזה:</b> V<sub>ph</sub> = V<sub>line</sub>/√3 (כוכב), I<sub>n</sub> = S<sub>n</sub>/(√3V<sub>line</sub>), וכל הספק מחלקים ב-3.</p>

<p class="f">R<sub>sc</sub> = P<sub>s.c</sub>/(3I<sub>n</sub>²) · Z<sub>sc</sub> = v<sub>s.c</sub>·V<sub>ph</sub>/I<sub>n</sub> · X<sub>sc</sub> = √(Z<sub>sc</sub>² − R<sub>sc</sub>²)</p>
<p>ואז מחלקים שווה: R<sub>1</sub> = R'<sub>2</sub> = R<sub>sc</sub>/2, X<sub>1</sub> = X'<sub>2</sub> = X<sub>sc</sub>/2.</p>
<p><b>ניסוי ריקם</b> (מתח נומינלי, בלי עומס – כמעט אין זרם בענף הטורי):</p>
<p class="f">R<sub>C</sub> = 3V<sub>ph</sub>²/P<sub>o.c</sub> · I<sub>C</sub> = V<sub>ph</sub>/R<sub>C</sub> · I<sub>φ</sub> = √(I<sub>0</sub>² − I<sub>C</sub>²) · X<sub>φ</sub> = V<sub>ph</sub>/I<sub>φ</sub></p>`,

  traps: ['לא לחלק את P ב-3 בתלת-פאזי.', 'להשתמש ב-V<sub>line</sub> במקום V<sub>ph</sub>.', 'לחשב X<sub>φ</sub> = V/I<sub>0</sub> – צריך קודם להוריד את הרכיב האקטיבי I<sub>C</sub>.'],
  exam: 'שאלה 1 בחלק מהמבחנים, לפעמים יחד עם זיהוי קבוצת החיבור מהשרטוט.',

Le.trLoad = {
  intro: 'כמה מתח מגיע לעומס? במעגל L זה פשוט מחלק מתח בין עכבת הקצר לבין העכבה המופנית של העומס.',
  body: `<div class="circ">${circuitSVG()}</div>
<p><b>שלבים:</b></p><ol><li>מפנים את העומס לצד הראשוני: Z'<sub>L</sub> = a²Z<sub>L</sub>, a = V<sub>1n</sub>/V<sub>2n</sub>.</li><li>מחלק מתח: V'<sub>2</sub> = V<sub>1</sub>·|Z'<sub>L</sub>| / |Z<sub>sc</sub> + Z'<sub>L</sub>|.</li><li>מחזירים לצד המשני: V<sub>2</sub> = V'<sub>2</sub>/a.</li></ol>
<p>במעגל L הענף המקבילי יושב בכניסה, על V<sub>1</sub> ישירות, ולכן הוא לא משפיע על מתח המוצא.</p>
<p>בדיקת סבירות: V<sub>2</sub> קצת מתחת לנומינלי (עומס השראי). עם עומס קיבולי הוא יכול לעלות מעליו.</p>`,

Le.imCircuit = {
  intro: 'זרם המנוע הוא סכום וקטורי של שני ענפים: זרם המגנוט הקבוע (ענף מקבילי), וזרם העומס שתלוי בהחלקה.',
  body: `<p class="f">Z<sub>load</sub> = (R<sub>1</sub> + R'<sub>2</sub>/s) + j(x<sub>1</sub> + x'<sub>2</sub>) · I'<sub>2</sub> = V<sub>ph</sub>/Z<sub>load</sub></p>
<p class="f">I<sub>0</sub> = V<sub>ph</sub>/R<sub>C</sub> − jV<sub>ph</sub>/x<sub>φ</sub> · Ĩ = Ĩ<sub>0</sub> + Ĩ'<sub>2</sub> · cosφ = Re{Ĩ}/|Ĩ|</p>
<p><b>שלבים:</b></p><ol><li>s מ-n<sub>n</sub> (n<sub>s</sub> הקרוב מעליו: 940 ⇒ 1000).</li><li>זרם הריקם: כמעט כולו ריאקטיבי ⇒ cosφ<sub>o.c</sub> נמוך מאוד.</li><li>זרם העומס: R'<sub>2</sub>/s גדול ⇒ כמעט אקטיבי.</li><li>מחברים ברכיבים (ממשי ומדומה בנפרד).</li><li>P<sub>n</sub> = η·P<sub>in</sub> = η·3V<sub>ph</sub>I cosφ.</li></ol>

// Wrap every run of Latin/math inside Hebrew text in <bdi dir=ltr>, so formulas keep their order in RTL lines.
const HEB = /[א-ת]/;
function isolateMath(root) {
  root.querySelectorAll('p, li, td, th, h1, h3, .readout, .q, .topic span, .choice span, .sliders span, .part label, .sym b, .sym span, .sym em').forEach(el => { if (!el.closest('.f, svg, bdi')) fixEl(el); });
  if (root.matches?.('.readout')) fixEl(root);
}
function fixEl(el) {
  const toks = [];
  [...el.childNodes].forEach(n => {
    if (n.nodeType === 3) n.textContent.split(/([א-ת][א-ת׳״"'\s–-]*[א-ת"']|[א-ת])/).forEach(s => s && toks.push({ heb: HEB.test(s), node: document.createTextNode(s) }));
    else if (n.nodeType === 1 && !HEB.test(n.textContent) && !n.matches('.f, br, svg, button, input, ol, ul, table')) toks.push({ heb: false, node: n });
    else { if (n.nodeType === 1 && !n.matches('.f, svg, bdi')) fixEl(n); toks.push({ heb: true, node: n }); }
  });
  if (!toks.some(t => !t.heb)) return;
  if (!toks.some(t => t.heb)) {   // no Hebrew at all: the whole element is one formula chip
    if (!/[A-Za-z0-9φγαβηδθλμεωΩÅ√]/.test(el.textContent) || el.matches('.f, bdi, button')) return;
    const b = document.createElement('bdi'); b.dir = 'ltr'; b.append(...el.childNodes); el.append(b); return;
  }
  const frag = document.createDocumentFragment(); let run = [];
  const flush = () => {
    if (!run.length) return;
    const txt = run.map(t => t.node.textContent).join('');
    if (/[A-Za-z0-9φγαβηδθλμεωΩÅ√]/.test(txt)) {
      // Keep edge punctuation outside the LTR box: spaces, ",.:;", a prefix hyphen (ב-PMOS), and unbalanced parentheses.
      const bal = () => { const t = run.map(x => x.node.textContent).join(''); return (t.match(/\(/g) || []).length - (t.match(/\)/g) || []).length; };
      let lead = '', tail = '';
      while (run.length && run[0].node.nodeType === 3) {
        const t = run[0].node.textContent, c = t[0];
        if (t === '') { lead += ''; run.shift(); continue; }
        const move = /[\s:;,.]/.test(c) || (/[-–]/.test(c) && lead === '' && /^[-–][A-Za-z0-9√φγαβηδθλμεωΩÅ(|]/.test(t)) || (c === '(' && bal() > 0) || (c === ')' && bal() < 0);
        if (!move) break; lead += c; run[0].node.textContent = t.slice(1);
      }
      while (run.length && run.at(-1).node.nodeType === 3) {
        const t = run.at(-1).node.textContent, c = t.at(-1);
        if (t === '') { run.pop(); continue; }
        const move = /[\s:;,.\-–]/.test(c) || (c === ')' && bal() < 0) || (c === '(' && bal() > 0);
        if (!move) break; tail = c + tail; run.at(-1).node.textContent = t.slice(0, -1);
      }
      if (!run.some(x => /[A-Za-z0-9φγαβηδθλμεωΩÅ√]/.test(x.node.textContent))) { frag.append(lead); run.forEach(t => frag.append(t.node)); frag.append(tail); run = []; return; }
      const b = document.createElement('bdi'); b.dir = 'ltr'; run.forEach(t => b.append(t.node));
      frag.append(lead, b, tail);
    } else run.forEach(t => frag.append(t.node));
    run = [];
  };
  toks.forEach(t => { if (t.heb) { flush(); frag.append(t.node); } else run.push(t); });
  flush();
  el.replaceChildren(frag);
}

// mc(correct, wrongs) → 4 shuffled choices built from typical mistakes.
function mc(correct, wrongs, f = v => fmt(v)) {
  const seen = new Set([f(correct)]), out = [];
  for (const w of wrongs) { const s = f(w); if (isFinite(w) && !seen.has(s)) { seen.add(s); out.push(w); } if (out.length === 3) break; }
  for (let k = 2; out.length < 3; k++) { const w = correct * (k % 2 ? k : 1 / k); if (!seen.has(f(w))) { seen.add(f(w)); out.push(w); } }
  const all = shuffleArr([[correct, true], ...out.map(w => [w, false])]);
  return { choices: all.map(x => f(x[0])), answer: all.findIndex(x => x[1]) };
}
function mcText(correct, wrongs) {
  const uniq = [...new Set(wrongs)].filter(w => w !== correct).slice(0, 3);
  const all = shuffleArr([[correct, true], ...uniq.map(w => [w, false])]);
  return { choices: all.map(x => x[0]), answer: all.findIndex(x => x[1]) };
}
const shuffleArr = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

// ---------------- המרת אנרגיה: שיעורים למתחילים ----------------
// Each lesson adds: simple (plain words + analogy), pic (SVG diagram), sym ([symbol, meaning, unit]), quiz ([{q, o, a, why}]).
// Notation follows Dr. Arbel's lectures: a = N1/N2, Rμ/Xμ (magnetizing branch), RK/XK (short-circuit), p = pole PAIRS, n1 = 60f/p.

// ---- schematic primitives: each returns an SVG string ----
const sv = (w, h, s) => `<svg class="sch" viewBox="0 0 ${w} ${h}">${s}</svg>`;
const pts = p => p.map(q => q.join(',')).join(' ');
const W = (...p) => `<polyline class="w" points="${pts(p)}"/>`;
const T = (x, y, t, c = '', a = 'middle') => `<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${t}</text>`;
const sbs = (m, s) => `${m}<tspan dy="3" font-size="8">${s}</tspan><tspan dy="-3"> </tspan>`;   // subscript inside SVG text
const Dot = (x, y) => `<circle cx="${x}" cy="${y}" r="2.6" class="dt"/>`;
function Rh(x1, y, x2, lab, c = 'w') { const m = (x1 + x2) / 2, z = [[x1, y], [m - 15, y]]; for (let i = 0; i < 6; i++) z.push([m - 12.5 + i * 5, y + (i % 2 ? 6 : -6)]); z.push([m + 15, y], [x2, y]); return `<polyline class="${c}" points="${pts(z)}"/>` + (lab ? T(m, y - 10, lab) : ''); }
function Rv(x, y1, y2, lab, c = 'w') { const m = (y1 + y2) / 2, z = [[x, y1], [x, m - 15]]; for (let i = 0; i < 6; i++) z.push([x + (i % 2 ? 6 : -6), m - 12.5 + i * 5]); z.push([x, m + 15], [x, y2]); return `<polyline class="${c}" points="${pts(z)}"/>` + (lab ? T(x + 10, m + 4, lab, '', 'start') : ''); }
function Lh(x1, y, x2, lab, c = 'w') { const m = (x1 + x2) / 2; return `<path class="${c}" d="M${x1} ${y}H${m - 16}a4 4 0 0 1 8 0a4 4 0 0 1 8 0a4 4 0 0 1 8 0a4 4 0 0 1 8 0H${x2}"/>` + (lab ? T(m, y - 10, lab) : ''); }
function Lv(x, y1, y2, lab, c = 'w') { const m = (y1 + y2) / 2; return `<path class="${c}" d="M${x} ${y1}V${m - 16}a4 4 0 0 1 0 8a4 4 0 0 1 0 8a4 4 0 0 1 0 8a4 4 0 0 1 0 8V${y2}"/>` + (lab ? T(x + 10, m + 4, lab, '', 'start') : ''); }
function Ch(x1, y, x2, lab, c = 'w') { const m = (x1 + x2) / 2; return W([x1, y], [m - 3, y]) + W([m + 3, y], [x2, y]) + `<path class="${c}" d="M${m - 3} ${y - 9}V${y + 9}M${m + 3} ${y - 9}V${y + 9}"/>` + (lab ? T(m, y - 13, lab) : ''); }
function Src(x, y, lab, side = 'start') { return `<circle cx="${x}" cy="${y}" r="13" class="src"/><path class="w" d="M${x - 7} ${y}q3.5 -7 7 0t7 0"/>` + (lab ? T(side === 'start' ? x + 18 : x - 18, y + 4, lab, '', side) : ''); }
function Arr(x1, y1, x2, y2, lab, c = 'h', lc = 'a') { const a = Math.atan2(y2 - y1, x2 - x1), h = 7; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/><polygon class="${c === 'h2' ? 'fl2' : 'fl'}" points="${x2},${y2} ${x2 - h * Math.cos(a - 0.4)},${y2 - h * Math.sin(a - 0.4)} ${x2 - h * Math.cos(a + 0.4)},${y2 - h * Math.sin(a + 0.4)}"/>` + (lab ? T(x2 + (x2 >= x1 ? 4 : -4), y2 - 5, lab, lc, x2 >= x1 ? 'start' : 'end') : ''); }
// Approximate transformer equivalent circuit (Rμ‖Xμ at the input, RK+jXK in series). hl: 'oc' | 'sc' | ''
function picTrEq(hl = '', note = '') {

Le.powerTri = {
  simple: `<p>לא כל הזרם שזורם ברשת עושה עבודה. חלק ממנו רק "מתנדנד" הלוך-חזור כדי למגנט סלילים (מנועים, שנאים). לכן יש שלושה הספקים:</p>
<p><b>P</b> <b>הספק ממשי</b> [W]: מה שבאמת הופך לחום או לתנועה. <b>Q</b> <b>הספק ריאקטיבי</b> [VAR]: האנרגיה שנאגרת ומוחזרת בכל מחזור. <b>S</b> <b>הספק מדומה</b> [VA]: מה שהרשת צריכה לספק בפועל, והוא קובע את עובי הכבלים.</p>
<p class="ana">🍺 אנלוגיה: כוס בירה. P הוא הבירה, Q הוא הקצף, ו-S היא הכוס כולה. משלמים על הבירה, אבל הכוס צריכה להכיל גם את הקצף.</p>
<p><b>מקדם הספק pf = cosθ = P/|S|</b> אומר כמה מהזרם "שימושי". pf נמוך פירושו זרם גדול סתם. לכן מחברים קבלים: הקבל מספק Q הפוך לזה של הסלילים, וכך מבטל אותו.</p>`,
  pic: picPowerTri,
  sym: [['S', 'הספק מרוכב (מדומה) = P + jQ = V·I*', 'VA'], ['P', 'הספק ממשי = |S|cosθ', 'W'], ['Q', 'הספק ריאקטיבי = |S|sinθ. חיובי = השראי, שלילי = קיבולי', 'VAR'],
    ['pf', 'מקדם הספק = cosθ. "מאחר" (lagging) = השראי, "מקדים" (leading) = קיבולי', '—'], ['θ', 'זווית העכבה = הזווית בין המתח לזרם', '°'], ['I*', 'הצמוד של הזרם (הופכים את סימן הזווית)', 'A'],
    ['Q<sub>C</sub>', 'ההספק הריאקטיבי שהקבלים צריכים לספק', 'VAR'], ['C', 'קיבול הקבל', 'F']],
  intro: 'מחברים הספקים מרוכבים של עומסים (S<sub>T</sub> = S<sub>1</sub> + S<sub>2</sub>), ומשם יוצאים pf וזרם הקו.',
  body: `<p class="f">S = V·I* = P + jQ · |S| = √(P² + Q²) · pf = cosθ = P/|S|</p>
<p class="f">תלת-פאזי: S = 3V<sub>p</sub>I<sub>p</sub>* · P = √3V<sub>L</sub>I<sub>L</sub>cosθ · Q = √3V<sub>L</sub>I<sub>L</sub>sinθ</p>
<p><b>תיקון מקדם הספק:</b> ה-P לא משתנה, רק Q יורד:</p>
<p class="f">Q<sub>C</sub> = P(tanθ<sub>old</sub> − tanθ<sub>new</sub>) · Q<sub>C</sub> = V²ωC ⇒ C = Q<sub>C</sub>/(ωV²)</p>
<p>בקבלים במשולש כל קבל מקבל Q<sub>C</sub>/3 על מתח הקו.</p>`,
  graph(box) {
    const P = plot(box, { x: [0, 120], y: [-10, 110], xl: 'P [kW]', yl: 'Q [kVAR]', xt: [[0, '0'], [50, '50'], [100, '100']], yt: [[0, '0'], [50, '50'], [100, '100']] });
    sliders(box, [{ k: 'P', label: 'P kW', min: 20, max: 110, step: 1, v: 90 }, { k: 'pf', label: 'pf לפני', min: 0.5, max: 1, step: 0.01, v: 0.73 }, { k: 'qc', label: 'Q<sub>C</sub> kVAR', min: 0, max: 100, step: 1, v: 0 }], v => {
      P.clear(); const Q = v.P * Math.tan(Math.acos(v.pf)), Q2 = Q - v.qc, S1 = Math.hypot(v.P, Q), S2 = Math.hypot(v.P, Q2), pf2 = v.P / S2;
      P.arrow(0, 0, v.P, 0, 'c2', 'P'); P.arrow(v.P, 0, v.P, Q, 'c3', 'Q', 4, 0); P.arrow(0, 0, v.P, Q, 'c3', '', 0, 0);
      if (v.qc) { P.arrow(v.P, Q, v.P, Q2, 'c5', '−Q_C', 4, 10); P.arrow(0, 0, v.P, Q2, 'c1', 'S חדש', -60, -4); }
      return `לפני: |S| = ${fmt(S1)} kVA, pf = ${fmt(v.pf)}<br>${v.qc ? `אחרי: |S| = ${fmt(S2)} kVA, pf = ${fmt(pf2)} ${Q2 < 0 ? '⚠ תיקון יתר – עכשיו קיבולי' : ''}<br>הזרם ירד ב-${fmt((1 - S2 / S1) * 100)}% – אותו P, פחות זרם!` : 'הזז את Q<sub>C</sub> כדי להוסיף קבלים'}`;
    });
  },
  ex: { src: 'שיעור 5, דוגמה 13', inputs: { P1: 30, pf1: 0.6, Q2: 45, pf2: 0.8, pt: 0.9, VL: 240, f: 60 } },

    { q: 'עומס 4 kW עם pf = 0.8 מפגר. מה Q?', o: ['3 kVAR', '5 kVAR', '3.2 kVAR', '4 kVAR'], a: 0, why: '|S| = 4/0.8 = 5 kVA, Q = √(5² − 4²) = 3. שוב משולש 3-4-5.' },

  traps: ['לחבר |S<sub>1</sub>| + |S<sub>2</sub>| – צריך לחבר P לחוד ו-Q לחוד.', 'לשכוח את הצמוד: S = VI*, ולא VI.', 'בתיקון pf: להשתמש ב-θ של היעד גם במקום θ הנוכחי.'],
  exam: 'מופיע כסעיף בשאלות תלת-פאזי: הספק כולל, pf, וקבלים לתיקון.',

  body: `<p class="f">P<sub>1</sub> = √3V<sub>L</sub>I<sub>L</sub>cosφ · P<sub>em</sub> = P<sub>1</sub> − ΔP<sub>cu1</sub> − ΔP<sub>Fe</sub></p>

<p class="ana">🎚️ הפלא: <b>T<sub>max</sub> לא תלוי ב-R'<sub>2</sub></b>. הגדלת התנגדות הרוטור רק <b>מזיזה</b> את השיא ימינה, לכיוון s = 1. כך אפשר לקבל מומנט התנעה מקסימלי (מנוע עם רוטור מלופף ונגדים חיצוניים).</p>`,
  pic: picImEq(),

  body: `<p class="f">T = (3V<sub>1</sub>²/ω<sub>s</sub>) · (R'<sub>2</sub>/s) / [(R<sub>1</sub> + R'<sub>2</sub>/s)² + X<sub>K</sub>²]</p>

// Root Locus and Routh–Hurwitz, built from the notes of the 11.11.2026 lecture. Notation as in the notes: L(s) = K·N(s)/D(s), n poles, m zeros,
// σas, θas, Kc, ωc; 0 < K < ∞ is negative feedback. Steps 1–8 are in the order used when the exam question was solved in class.
// Parts marked "השלמה" (departure from a double pole, break-in point) are not in the notes; they are only there to finish the full sketch.
// Polynomials are coefficient arrays, highest power first. An open loop is given by its real poles p[] and real zeros z[].
const fm = x => fmt(x).replace('-', '−');
const pmul = (a, b) => { const o = Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => o[i + j] += x * y)); return o; };
// a root list may hold [re, im] for the complex pair re ± j·im
const pfrom = rs => rs.reduce((q, r) => pmul(q, Array.isArray(r) ? [1, -2 * r[0], r[0] ** 2 + r[1] ** 2] : [1, -r]), [1]);
const pder = a => a.slice(0, -1).map((x, i) => x * (a.length - 1 - i));
const psub = (a, b) => { const n = Math.max(a.length, b.length), A = [...Array(n - a.length).fill(0), ...a], B = [...Array(n - b.length).fill(0), ...b]; return A.map((x, i) => x - B[i]); };
const pval = (a, s) => a.reduce((y, c) => y * s + c, 0);
const pstr = a => a.map((c, i) => [c, a.length - 1 - i]).filter(([c]) => Math.abs(c) > 1e-12).map(([c, k], j) => { const m = Math.abs(c), t = (m === 1 && k ? '' : fmt(m)) + (k ? 's' + ['', '', '²', '³', '⁴', '⁵'][k] : ''); return (c < 0 ? (j ? ' − ' : '−') : (j ? ' + ' : '')) + t; }).join('');
// roots of a real polynomial by Durand–Kerner → [[re, im], …]
function polyRoots(c) {
  const n = c.length - 1, a = c.map(x => x / c[0]);
  let r = Array.from({ length: n }, (_, i) => Cx.p(1 + Math.max(...a.map(Math.abs)), 360 * i / n + 23));
  for (let it = 0; it < 120; it++) r = r.map((s, i) => {
    let num = [1, 0], den = [1, 0];
    for (let k = 1; k <= n; k++) num = Cx.add(Cx.mul(num, s), [a[k], 0]);
    r.forEach((w, j) => { if (j !== i) den = Cx.mul(den, Cx.sub(s, w)); });
    const d = Cx.div(num, den); return isFinite(d[0] + d[1]) ? Cx.sub(s, d) : s;
  });
  return r;
}
// closed-loop poles = roots of D(s) + K·N(s)
const clPoles = (p, z, K) => { const D = pfrom(p), N = pfrom(z), off = D.length - N.length; return polyRoots(D.map((d, i) => d + (i >= off ? K * N[i - off] : 0))); };
const rlFac = rs => { const c = new Map(); rs.forEach(r => c.set(r, (c.get(r) || 0) + 1)); return [...c].map(([r, k]) => (r === 0 ? 's' : `(s ${r < 0 ? '+' : '−'} ${Math.abs(r)})`) + (k > 1 ? `<sup>${k}</sup>` : '')).join(''); };
const rlL = (p, z) => `L(s) = K${rlFac(z)} / [${rlFac(p)}]`;
const rlList = a => a.length ? a.map(fm).join(', ') : 'אין';
// inside a solution step: formula lines in their own LTR block, and a Routh table (rows of [power, …cells]).
// Lines are joined with <br/> on purpose: a plain <br> is what separates the steps of a solution.
const blk = (...l) => `<div class="f">${l.join('<br/>')}</div>`;
const rhT = rows => `<table class="t">${rows.map(([h, ...c]) => `<tr><th>${h}</th>${c.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
// real-axis segments of the RL between x1 and x2: an odd number of poles + zeros to the right (K > 0), an even number for K < 0
const rlRealSegs = (p, z, x1, x2, pos = false) => { const all = [...p, ...z].filter(v => !Array.isArray(v)), xs = [x1, ...[...new Set(all)].sort((a, b) => a - b).filter(v => v > x1 && v < x2), x2];
  return xs.slice(1).map((b, i) => [xs[i], b]).filter(([a, b]) => all.filter(v => v > (a + b) / 2).length % 2 === (pos ? 0 : 1)); };
// step 9: numerator of dK/ds, with K = −D/N ⇒ D′N − DN′ = 0 (leading coefficient made positive)
const rlNum = (p, z) => { const D = pfrom(p), N = pfrom(z), n = psub(pmul(pder(D), N), pmul(D, pder(N))); while (n.length > 1 && Math.abs(n[0]) < 1e-12) n.shift(); return n[0] < 0 ? n.map(x => -x) : n; };

function rlBreaks(p, z, pos = false) {
  const D = pfrom(p), N = pfrom(z), pz = [...p, ...z].filter(v => !Array.isArray(v));
  return polyRoots(rlNum(p, z)).filter(r => Math.abs(r[1]) < 1e-6 && pz.every(v => Math.abs(v - r[0]) > 1e-4)).map(r => ({ s: r[0], K: -pval(D, r[0]) / pval(N, r[0]) }))
    .filter(b => pos ? b.K < 0 : b.K > 0).sort((a, b) => b.s - a.s);
}

        ['אילו ערכים לא יכולים להיות K קריטי?', 'K = 0 ו-K → ∞', ['K שמאפס שורה בטבלת Routh', 'K שבו ענף נמצא על הציר המדומה', 'K חיובי כלשהו'], 'כך נקבע בשיעור: K = 0 ו-K = ∞ לא נחשבים ערכים קריטיים. אלה נקודות ההתחלה והסיום של הענפים.'],

    routh: { group: 'stab', title: 'Routh–Hurwitz: K קריטי ותדר החיתוך', gen(o = {}) {
      const a = o.a ?? pick([1, 2, 3]), b = o.b ?? a + pick([1, 2, 3, 4]), s = a + b, pr = a * b, Kc = s * pr, wc = sq(pr);
      return { text: `L(s) = K / [s(s + ${a})(s + ${b})] במשוב שלילי (0 < K < ∞). מצאו בעזרת Routh–Hurwitz את ה-K הקריטי ואת תדר החיתוך של ה-RL עם הציר המדומה.`,
        parts: [{ label: 'K<sub>c</sub>', ans: Kc, unit: '' }, { label: 'ω<sub>c</sub>', ans: wc, unit: 'rad/s', units: U('rad/s', 'Hz') }],
        sol: [`כותבים את המשוואה האופיינית K·N(s) + D(s) = 0${blk(`s(s + ${a})(s + ${b}) + K = 0`, `s³ + ${s}s² + ${pr}s + K = 0`)}`,
          `טבלת Routh${blk(rhT([['s³', 1, pr], ['s²', s, 'K'], ['s¹', `B<sub>1</sub> = (${Kc} − K)/${s}`, 0], ['s⁰', 'K', '']]))}`,
          `כל העמודה הראשונה צריכה להיות חיובית${blk(`K > 0 &nbsp;·&nbsp; ${Kc} − K > 0`, `0 < K < ${Kc}`)}`,
          `ה-K הקריטי מאפס את שורת s¹${blk(`K<sub>c</sub> = <b>${Kc}</b>`)}`,
          `בונים פולינום מהשורה שמעל, שורת s²${blk(`${s}s² + K<sub>c</sub> = 0`, `s² = −${Kc}/${s} = −${pr}`, `s = ±j√${pr}`)}`,
          `תדר החיתוך עם הציר המדומה${blk(`ω<sub>c</sub> = √${pr} = <b>${fmt(wc)} rad/s</b>`)}`,
          `כאן הענפים חוצים משמאל לימין, ולכן המערכת יציבה עבור K < ${Kc}`].join('<br>') };
    } },
    rlExam: { group: 'stab', title: 'שאלת מבחן מלאה: שרטוט RL ותחום יציבות', gen(o = {}) {
      const z = o.z ?? pick([1, 2]), p = o.p ?? pick([1, 2, 3]);
      const sas = 2 * (p + z), c = p * p - 4 * p * z - z * z, dsc = sq(c * c + 16 * z * p ** 3), Kc = (-c + dsc) / (4 * z), K2 = (-c - dsc) / (4 * z), wc = sq(p * p + 2 * z * Kc);
      const b = 3 * z + p, sb = (-b - sq(b * b + 4 * p * z)) / 2, sb2 = (-b + sq(b * b + 4 * p * z)) / 2, Kb = -sb * (sb - p) ** 2 / (sb + z) ** 2, D2 = 2 * p, a1 = `${p * p} + ${2 * z}K`, a0 = `${z * z === 1 ? '' : z * z}K`;
      return { text: `נתון P(s) = (s + ${z})<sup>2</sup> / [s(s² − ${2 * p}s + ${p * p})] בחוג סגור עם משוב שלילי והגבר 0 < K < ∞. שרטטו את ה-RL בצורה מלאה ומפורטת, וחשבו את נקודת היציאה של האסימפטוטות, את ה-K הקריטי ואת תדר החיתוך עם הציר המדומה.`,
        parts: [{ label: 'σ<sub>as</sub>', ans: sas, unit: '' }, { label: 'K<sub>c</sub>', ans: Kc, unit: '' }, { label: 'ω<sub>c</sub>', ans: wc, unit: 'rad/s', units: U('rad/s', 'Hz') }],
        sol: [`מפרקים את המכנה לגורמים${blk(`s² − ${D2}s + ${p * p} = (s − ${p})²`, `L(s) = K(s + ${z})² / [s(s − ${p})²]`)}`,
          `<u>שלב 1</u>: כש-K = 0 מתחילים בקטבי החוג הפתוח${blk(`p = 0, ${p}, ${p} &nbsp;⇒&nbsp; n = 3`)}`,
          `<u>שלב 2</u>: כש-K → ∞ מסיימים באפסים, והענף השלישי הולך לאינסוף${blk(`z = −${z}, −${z} &nbsp;⇒&nbsp; m = 2`)}`,

          `<u>שלב 7</u>: אין קטבים או אפסים מרוכבים. שני הענפים יוצאים מהקוטב הכפול ב-s = ${p} אנכית, בזוויות ±90°, כי על הציר שלידו אין ענף`,

          `<u>התמונה</u>: שני ענפים יוצאים מ-s = ${p} אנכית, חוצים את הציר המדומה בגובה ω = ${fmt(wc)}, וחוזרים לציר הממשי ב-s = ${fm(sb)}. משם אחד הולך לאפס ב-s = −${z} והשני לאינסוף. הענף השלישי הולך מהראשית אל האפס ב-s = −${z}`].join('<br>') };

    rlExamB: { group: 'stab', title: 'שאלת מבחן, סעיף ב׳: משוב חיובי וקטבים מרוכבים', gen(o = {}) {

      return { text: `נתון P(s) = (s + 1) / [s(s² − 4s + ${c})] בחוג סגור עם <b>משוב חיובי</b>, −∞ < K < 0. שרטטו את ה-RL בצורה מלאה ומפורטת, וחשבו את נקודת היציאה של האסימפטוטות, את זווית היציאה מהקוטב s = 2 + ${bj} ואת נקודת החדירה לציר הממשי.`,

  sheet: (m => `<h3>Root Locus</h3><p>${m('L(s) = K·N(s)/D(s)')} · ${m('T = L/(1 + L) = K·N/(K·N + D)')} · משוואה אופיינית: ${m('K·N(s) + D(s) = 0')}<br>${m('K = 0')}: קטבי החוג הפתוח · ${m('K → ∞')}: אפסי החוג הפתוח, ועוד ${m('n − m')} ענפים לאינסוף<br>מספר הענפים: ${m('max(n, m)')} · סימטריה סביב הציר הממשי<br>אסימפטוטות: ${m('n − m')} · ${m('σ<sub>as</sub> = (Σp − Σz)/(n − m)')} · ${m('θ<sub>i</sub> = (2i + 1)·180°/(n − m)')} · משוב חיובי: ${m('θ<sub>i</sub> = 2i·180°/(n − m)')}<br>ציר ממשי, ${m('K &gt; 0')}: ענף קיים כשמימין מספר אי-זוגי של קטבים ואפסים. ${m('K &lt; 0')}: זוגי</p>

// ---------- s-plane drawing on top of plot(). B = [x1, x2, y1, y2] ----------
// axes through the origin; the right half-plane (unstable) is tinted
function drawSPlane(P, B, shade = true) {
  if (shade) P.rect(0, B[2], B[1], B[3] - B[2], 'fill bad');
  P.el('line', { x1: P.X(B[0]), x2: P.X(B[1]), y1: P.Y(0), y2: P.Y(0), class: 'ax' }); P.el('line', { x1: P.X(0), x2: P.X(0), y1: P.Y(B[2]), y2: P.Y(B[3]), class: 'ax' });
}
// open-loop poles (×) and zeros (○) on the real axis; a double one gets a small tag
function drawPZ(P, p, z) {
  const re = a => a.filter(v => !Array.isArray(v)), cx = a => a.filter(Array.isArray).flatMap(([x, y]) => [[x, y], [x, -y]]);
  const cnt = a => re(a).reduce((m, v) => m.set(v, (m.get(v) || 0) + 1), new Map());
  const tag = (x, k) => { if (k > 1) P.el('text', { x: P.X(x), y: P.Y(0) - 9, class: 'tick', 'text-anchor': 'middle' }, k === 2 ? 'כפול' : '×' + k); };
  const O = (x, y) => P.el('circle', { cx: P.X(x), cy: P.Y(y), r: 4.5, class: 'px zo' }), X = (x, y) => { const a = P.X(x), b = P.Y(y); P.el('path', { d: `M${a - 4} ${b - 4}l8 8M${a - 4} ${b + 4}l8 -8`, class: 'px' }); };
  cnt(z).forEach((k, x) => { O(x, 0); tag(x, k); }); cx(z).forEach(([x, y]) => O(x, y));
  cnt(p).forEach((k, x) => { X(x, 0); tag(x, k); }); cx(p).forEach(([x, y]) => X(x, y));
}
// a dashed ray from (x0, 0) at angle th°, clipped to the box
function drawRay(P, x0, th, B, cls = 'c2') {
  const c = Math.cos(th * Math.PI / 180), s = Math.sin(th * Math.PI / 180);
  const t = Math.min(c > 1e-9 ? (B[1] - x0) / c : c < -1e-9 ? (B[0] - x0) / c : Infinity, s > 1e-9 ? B[3] / s : s < -1e-9 ? B[2] / s : Infinity);
  P.el('line', { x1: P.X(x0), y1: P.Y(0), x2: P.X(x0 + t * c), y2: P.Y(t * s), class: 'dash ' + cls });
}
// RL data for 0 < K < Kmax inside the box: real-axis segments + the complex branch (upper half) as [re, im, K] points.
// Sweeps K and bisects where the complex pair appears, disappears or leaves the box. Follows one complex pair, which covers order ≤ 3.
function rlData(p, z, B, Kmax) {
  const up = K => { const r = clPoles(p, z, K).find(q => q[1] > 1e-3); return r && r[0] >= B[0] && r[0] <= B[1] && r[1] <= B[3] ? [...r, K] : null; };
  const segs = []; let cur = null, Kp = 0;
  for (let i = 0; i <= 240; i++) {
    const K = Kmax * (i / 240) ** 3, c = up(K);
    if (i && !!c !== !!cur) {
      let a = Kp, b = K; const edge = [];
      for (let k = 0; k < 18; k++) { const m = (a + b) / 2, r = up(m); if (r) edge.push(r); !!r === !!cur ? a = m : b = m; }
      if (cur) { segs.push([...cur, ...edge]); cur = null; } else cur = edge.reverse();
    }
    if (c) (cur ||= []).push(c);
    Kp = K;
  }
  if (cur) segs.push(cur);
  return { p, z, real: rlRealSegs(p, z, B[0], B[1], Kmax < 0), segs };
}
const drawReal = (P, d) => d.real.forEach(([a, b]) => P.path([[a, 0], [b, 0]], 'c1'));
const drawBranch = (P, d, Kto = Infinity) => d.segs.forEach(s => { const q = s.filter(r => Math.abs(r[2]) <= Math.abs(Kto)); P.path(q, 'c1'); P.path(q.map(r => [r[0], -r[1]]), 'c1'); });

Lc.routh = {

  intro: 'הטבלה נותנת את תחום K ליציבות, את K קריטי, ודרך השורה שמעל שורת האפסים גם את נקודת החיתוך.',
  body: `<p>למשוואה אופיינית מסדר 3:</p><p class="f">a<sub>3</sub>s³ + a<sub>2</sub>s² + a<sub>1</sub>s + a<sub>0</sub> = 0</p>

<p><b>מציאת ω<sub>c</sub> מהטבלה</b>, במקום להציב K<sub>c</sub> במשוואה האופיינית המלאה:</p>

<p>למה לא להציב K<sub>c</sub> ישר במשוואה האופיינית? בעיה 1: הסדר של המשוואה. בעיה 2: לא כל הפתרונות שלה חותכים את הגבול.</p>`,

Lc.rlBreak = {
